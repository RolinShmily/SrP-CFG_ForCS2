name: CI

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# 日常 push / PR 只跑轻量检查（数据漂移、网站单测、typecheck、workflow lint），
# 重检查（CFG 架构、命令库脚本测试、Rust 核心/许可、Windows 壳层编译）放到发版关口，
# 即 push 到 v* tag 时（或手动 workflow_dispatch）才跑，避免每次提交都被长任务拖住。
# 测试强度不变——没有任何测试被删除，只是调整了触发时机。

jobs:
  validate:
    name: Config drift & website unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      # keymaps.json 由 config/srp-cfg 生成并随仓库提交（typecheck 需要它存在），
      # 故在此校验产物与 cfg 一致，避免改了 cfg 忘了重新生成。仅用 Node 内置模块，无需装依赖。
      - name: Verify keymaps.json matches config/
        run: node scripts/extract-keymaps.mjs --check

      # crosshair.json 同理：由 config/srp-cfg 生成并随仓库提交。
      # 顺带会报告 public/images/crosshair/ 里已就位的截图数量。
      - name: Verify crosshair.json matches config/
        run: node scripts/extract-crosshair.mjs --check

      # 跑 app/website 的 unit tests：ai-stream 解析与功能页数据一致性。
      # 后者断言的是「数据对得上但渲染/语义错了」这类问题，例如画布上左右修饰键 id 重复。
      # 测试只 import 相对路径的 .ts（node --experimental-strip-types）与 .json，
      # 不依赖 pnpm / node_modules，直接调 node 即可，避免本 job 额外引入 pnpm 链路。
      - name: Run website unit tests
        working-directory: app/website
        run: node --experimental-strip-types --test src/lib/ai-stream.test.ts src/app/components/features/consistency.test.ts

  config-validation:
    name: CFG architecture & command tooling tests
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: .github/scripts/requirements-packages.txt

      - name: Install packaging dependencies
        run: python3 -m pip install -r .github/scripts/requirements-packages.txt

      - name: Validate CFG architecture
        run: python3 .github/scripts/validate_cfg.py

      # 纯单元测试，无网络无凭据；放在发版关口上，避免 update_commands.py 的回归
      # 只能等到每日定时任务才暴露。
      - name: Run command update unit tests
        run: |
          python3 .github/scripts/test_command_values.py
          python3 .github/scripts/test_update_commands.py
          python3 .github/scripts/test_ai_preflights.py

  typescript:
    name: TypeScript type-check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      # --ignore-scripts：类型检查只需依赖的 .d.ts 与 tsconfig，无需任何生命周期脚本
      # （TypeScript 7 本身也不带脚本，只以平台专属原生二进制包分发编译器）。
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Type-check website and desktop
        run: pnpm check:types

  desktop-shell:
    name: Desktop shell (Tauri, Windows)
    runs-on: windows-latest
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache cargo registry and build target
        uses: swatinem/rust-cache@v2
        with:
          workspaces: app/desktop/src-tauri

      # 壳层（src/**）依赖 tauri，在 Linux 上需要 webkit2gtk 才能编译，因此只能在此平台把关。
      # 该检查较重（Windows 全量 cargo），只在发版时跑；日常 push 的 TS 层由 typecheck 把关。
      - name: Type-check the Tauri shell
        run: cargo check --workspace --manifest-path app/desktop/src-tauri/Cargo.toml

      # 壳层自身的单元测试（含快照 id 路径穿越防线）。
      - name: Run desktop shell unit tests
        run: cargo test -p srp-cfg-desktop --manifest-path app/desktop/src-tauri/Cargo.toml

  rust-and-licenses:
    name: Rust core tests & license inventory
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry and build target
        uses: swatinem/rust-cache@v2
        with:
          workspaces: app/desktop/src-tauri

      # 纯逻辑核心的测试（含归档路径穿越防线）与许可清单校验，随发版关口执行。
      - name: Run Rust core unit tests
        run: cargo test -p srp-cfg-core --manifest-path app/desktop/src-tauri/Cargo.toml

      # --ignore-scripts：本任务只解析依赖图与许可声明，无需执行任何生命周期脚本。
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Verify THIRD_PARTY_LICENSES.md matches the dependency graph
        run: pnpm check:licenses

  workflows:
    name: Lint GitHub Actions workflows
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # actionlint 是一枚 Go 单文件二进制，上游提供官方 checksums 文件，因此这里按版本
      # + SHA256 固定，而不执行任何远程安装脚本（`curl … | bash` 这类写法等于把
      # CI 的执行权交给一个可变的远程脚本）。
      #
      # 升级步骤：改 ACTIONLINT_VERSION，并从同一 release 的
      # actionlint_<ver>_checksums.txt 里取 linux_amd64 的新哈希。
      - name: Install actionlint (pinned, checksum verified)
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          set -euo pipefail
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSL -o "$archive" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${archive}"
          echo "${ACTIONLINT_SHA256}  ${archive}" | sha256sum -c -
          tar -xzf "$archive" actionlint
          sudo install -m 0755 actionlint /usr/local/bin/actionlint
          actionlint --version

      # 会连带对 `run:` 块跑 shellcheck（ubuntu-latest 已预装），
      # 因此内嵌 shell 的引用/引用不当也会被拦下。
      - name: Lint workflows
        run: actionlint -color