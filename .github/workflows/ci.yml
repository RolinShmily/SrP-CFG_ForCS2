name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate config & unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: .github/scripts/requirements-packages.txt

      - name: Install packaging dependencies
        run: python3 -m pip install -r .github/scripts/requirements-packages.txt

      - name: Validate CFG architecture
        run: python3 .github/scripts/validate_cfg.py

      # 纯单元测试，无网络无凭据；放在 PR 关口上，避免 update_commands.py 的回归
      # 只能等到每日定时任务才暴露。
      - name: Run command update unit tests
        run: |
          python3 .github/scripts/test_command_values.py
          python3 .github/scripts/test_update_commands.py
          python3 .github/scripts/test_ai_preflights.py

      - name: Run config knowledge tests
        run: |
          node --test .github/scripts/sync_config_vectorize.test.mjs
          node .github/scripts/sync_config_vectorize.mjs --dry-run

      - name: Run website unit tests
        run: node --experimental-strip-types --test app/website/src/lib/ai-stream.test.ts app/website/src/worker.test.ts

  typescript:
    name: TypeScript type-check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      # --ignore-scripts：类型检查只需依赖的 .d.ts 与 tsconfig，无需任何生命周期脚本
      # （TypeScript 7 本身也不带脚本，只以平台专属原生二进制包分发编译器）。
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Type-check website and desktop
        run: pnpm check:types

  desktop-shell:
    name: Desktop shell (Tauri, Windows)
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache cargo registry and build target
        uses: swatinem/rust-cache@v2
        with:
          workspaces: app/desktop/src-tauri

      # 壳层（src/**）依赖 tauri，在 Linux 上需要 webkit2gtk 才能编译，因此只能在此平台把关。
      # 此前壳层不被任何 PR 检查编译：zip / winreg 这类壳层依赖的破坏性升级
      # 只会在打 tag 发版时才暴露。
      - name: Type-check the Tauri shell
        run: cargo check --workspace --manifest-path app/desktop/src-tauri/Cargo.toml

      # 壳层自身的单元测试（含快照 id 路径穿越防线）也必须跑起来。
      - name: Run desktop shell unit tests
        run: cargo test -p srp-cfg-desktop --manifest-path app/desktop/src-tauri/Cargo.toml

  rust-and-licenses:
    name: Rust core tests & license inventory
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry and build target
        uses: swatinem/rust-cache@v2
        with:
          workspaces: app/desktop/src-tauri

      # 纯逻辑核心的测试（含归档路径穿越防线）必须在 PR 阶段就跑，
      # 不能只在发版的 release-desktop 里执行。
      - name: Run Rust core unit tests
        run: cargo test -p srp-cfg-core --manifest-path app/desktop/src-tauri/Cargo.toml

      # --ignore-scripts：本任务只解析依赖图与许可声明，无需执行任何生命周期脚本。
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Verify THIRD_PARTY_LICENSES.md matches the dependency graph
        run: pnpm check:licenses

  workflows:
    name: Lint GitHub Actions workflows
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # actionlint 是一枚 Go 单文件二进制，上游提供官方 checksums 文件，因此这里按版本
      # + SHA256 固定，而不执行任何远程安装脚本（`curl … | bash` 这类写法等于把
      # CI 的执行权交给一个可变的远程脚本）。
      #
      # 升级步骤：改 ACTIONLINT_VERSION，并从同一 release 的
      # actionlint_<ver>_checksums.txt 里取 linux_amd64 的新哈希。
      - name: Install actionlint (pinned, checksum verified)
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          set -euo pipefail
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSL -o "$archive" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${archive}"
          echo "${ACTIONLINT_SHA256}  ${archive}" | sha256sum -c -
          tar -xzf "$archive" actionlint
          sudo install -m 0755 actionlint /usr/local/bin/actionlint
          actionlint --version

      # 会连带对 `run:` 块跑 shellcheck（ubuntu-latest 已预装），
      # 因此内嵌 shell 的引用/引用不当也会被拦下。
      - name: Lint workflows
        run: actionlint -color
