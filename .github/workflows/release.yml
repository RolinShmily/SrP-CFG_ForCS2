name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Publish Release
    runs-on: windows-latest
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'

    steps:
      - name: Validate SemVer tag format
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          echo "Triggered tag: ${TAG}"
          if [[ "${TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "Tag validation passed."
          else
            echo "::error::Tag '${TAG}' does not match required semver format v3.4.0 (regex: ^v[0-9]+\.[0-9]+\.[0-9]+$)"
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Setup Ninja
        uses: ashutoshvarma/setup-ninja@master
        with:
          version: 1.11.1

      - name: Setup Inno Setup
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          echo "C:\Program Files (x86)\Inno Setup 6" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install Qt 6
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.0'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_msvc2022_64'

      - name: Configure CMake
        run: |
          cmake -B build -S . -G "Ninja" -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$env:QT_ROOT_DIR"

      - name: Build Release Targets
        run: |
          cmake --build build --config Release

      - name: Package CLI, GUI, and Setup Installer
        shell: pwsh
        run: |
          $qtBin = "$env:QT_ROOT_DIR/bin"
          $tag = if ("${{ github.ref_name }}" -match "^v[0-9]") { "${{ github.ref_name }}" } else { "v3.4.0-dev" }
          New-Item -ItemType Directory -Path "dist" -Force | Out-Null

          # ==========================================
          # 1. 打包 Standalone CLI 独立命令行包
          # ==========================================
          $cliDir = "dist/srp-cfg-$tag-windows-x64-cli"
          New-Item -ItemType Directory -Path $cliDir -Force | Out-Null
          Copy-Item "build/app/cli/srp_cli.exe" -Destination "$cliDir/srp.exe"
          Copy-Item "LICENSE" -Destination "$cliDir/" -ErrorAction SilentlyContinue
          Copy-Item "README.md" -Destination "$cliDir/" -ErrorAction SilentlyContinue
          $cliZip = "dist/srp-cfg-$tag-windows-x64-cli.zip"
          Compress-Archive -Path "$cliDir" -DestinationPath $cliZip -Force

          # ==========================================
          # 2. 打包 Standalone GUI 绿色便携免安装包 (自带离线出厂预设)
          # ==========================================
          $guiDir = "dist/srp-cfg-$tag-windows-x64-gui"
          New-Item -ItemType Directory -Path $guiDir -Force | Out-Null
          Copy-Item "build/app/gui/srp_gui.exe" -Destination "$guiDir/SrP-CFG.exe"
          Copy-Item "build/app/cli/srp_cli.exe" -Destination "$guiDir/srp.exe"

          # 拷入 HuskarUI 动态链接库
          Copy-Item "build/HuskarUI/bin/HuskarUIBasic.dll" -Destination "$guiDir/" -ErrorAction SilentlyContinue
          Copy-Item "build/HuskarUI/bin/HuskarUIImpl.dll" -Destination "$guiDir/" -ErrorAction SilentlyContinue
          Copy-Item "build/bin/HuskarUIBasic.dll" -Destination "$guiDir/" -ErrorAction SilentlyContinue
          Copy-Item "build/bin/HuskarUIImpl.dll" -Destination "$guiDir/" -ErrorAction SilentlyContinue

          # 随附出厂 config/ 预设资产包 (保证开箱即用)
          Copy-Item "config" -Destination "$guiDir/config" -Recurse -Force

          Copy-Item "LICENSE" -Destination "$guiDir/" -ErrorAction SilentlyContinue
          Copy-Item "README.md" -Destination "$guiDir/" -ErrorAction SilentlyContinue

          # 自动收集 Qt 运行时与 QML 模块依赖
          & "$qtBin/windeployqt.exe" --qmldir "app/gui/qml" --release --no-translations --no-opengl-sw --compiler-runtime "$guiDir/SrP-CFG.exe"

          # 瘦身裁剪：移除无用光栅器与冗余 QML 样式
          Remove-Item -Path "$guiDir/opengl32sw.dll" -Force -ErrorAction SilentlyContinue
          Remove-Item -Path "$guiDir/D3Dcompiler_47.dll" -Force -ErrorAction SilentlyContinue
          Remove-Item -Path "$guiDir/Qt6OpenGL.dll" -Force -ErrorAction SilentlyContinue

          $unusedStyles = @("FluentWinUI3", "Imagine", "Material", "Universal", "Fusion")
          foreach ($style in $unusedStyles) {
              Remove-Item -Path "$guiDir/qml/QtQuick/Controls/$style" -Recurse -Force -ErrorAction SilentlyContinue
              Remove-Item -Path "$guiDir/Qt6QuickControls2$style.dll" -Force -ErrorAction SilentlyContinue
          }

          $guiZip = "dist/srp-cfg-$tag-windows-x64-gui.zip"
          Compress-Archive -Path "$guiDir" -DestinationPath $guiZip -Force

          # ==========================================
          # 3. 构建 Windows 安装器 (Inno Setup)
          # ==========================================
          $absGuiDir = (Resolve-Path "$guiDir").Path
          $absDistDir = (Resolve-Path "dist").Path
          ISCC.exe /DMyAppVersion="$tag" /DSourceDir="$absGuiDir" /DOutputDir="$absDistDir" installer/installer.iss

          # ==========================================
          # 4. 生成客户端升级清单 latest.json
          # ==========================================
          $guiSha256 = (Get-FileHash -Path $guiZip -Algorithm SHA256).Hash.ToLower()
          $setupExePath = "dist/srp-cfg-$tag-windows-x64-setup.exe"
          $setupSha256 = if (Test-Path $setupExePath) { (Get-FileHash -Path $setupExePath -Algorithm SHA256).Hash.ToLower() } else { "" }
          $cleanAppVer = $tag.TrimStart('v')

          $latest = @{
              version = $cleanAppVer
              tag = $tag
              published_at = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
              gui_zip_url = "https://github.com/${{ github.repository }}/releases/download/$tag/srp-cfg-$tag-windows-x64-gui.zip"
              gui_zip_sha256 = $guiSha256
              setup_exe_url = "https://github.com/${{ github.repository }}/releases/download/$tag/srp-cfg-$tag-windows-x64-setup.exe"
              setup_exe_sha256 = $setupSha256
              notes_zh = "SrP-CFG $tag 发布"
              notes_en = "SrP-CFG $tag Release"
          } | ConvertTo-Json -Depth 4
          $latest | Set-Content -Path "dist/latest.json" -Encoding utf8

      # ==========================================
      # 5. 发布到 GitHub Releases (仅包含软件制品)
      # ==========================================
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: |
            dist/srp-cfg-*-windows-x64-cli.zip
            dist/srp-cfg-*-windows-x64-gui.zip
            dist/srp-cfg-*-windows-x64-setup.exe
            dist/latest.json
          draft: false
          prerelease: false
          generate_release_notes: true
