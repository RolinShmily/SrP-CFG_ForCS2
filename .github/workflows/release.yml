name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    name: Validate Tag & Changelog
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    outputs:
      version: ${{ steps.tag.outputs.version }}
    steps:
      - name: Validate SemVer tag format
        id: tag
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          echo "Triggered ref: ${TAG}"
          if [[ "${TAG}" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            echo "version=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "version=" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Tag '${TAG}' does not match required semver format vMAJOR.MINOR.PATCH"
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Validate CHANGELOG and repository integrity
        run: |
          python3 scripts/extract_changelog.py --check
          python3 scripts/check_repository.py
          python3 tests/content/test_content_packages.py

  build:
    name: Build Windows Artifacts
    needs: validate
    uses: ./.github/workflows/build.yml
    with:
      version: ${{ needs.validate.outputs.version }}

  publish:
    name: Publish GitHub Release
    needs: [validate, build]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-bundle
          path: dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          body_path: dist/release_notes.md
          fail_on_unmatched_files: true
          files: |
            dist/release/*
          draft: false
          prerelease: false
          generate_release_notes: false
