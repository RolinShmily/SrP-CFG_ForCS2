name: Deploy Website & Packages

on:
  push:
    branches: [main]
    paths:
      - 'content/**'
      - 'website/**'
      - 'worker/**'
      - 'wrangler.toml'
      - 'scripts/check_repository.py'
      - 'scripts/package_content.py'
      - 'LICENSE'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Build & Deploy Cloudflare Worker
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          # Full history so package_content.py derives exact per-package updated_at dates.
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.3.0
          run_install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Package content archives & manifest
        run: |
          python3 scripts/check_repository.py
          python3 scripts/package_content.py --output website/public

      - name: Collect dependency licenses
        run: pnpm --filter srp-cfg-website licenses:collect

      - name: Build static website & Pagefind index
        run: pnpm --filter srp-cfg-website build

      - name: Deploy Cloudflare Worker (Site + Packages + /releases/* Proxy)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: "false"
        run: npm exec --yes --ignore-scripts --package=wrangler@4.147.0 -- wrangler deploy --config wrangler.toml
