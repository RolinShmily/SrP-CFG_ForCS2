name: Test

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'content/**'
      - 'worker/**'
      - 'website/**'
      - 'tests/**'
      - 'scripts/**'
      - 'CMakeLists.txt'
      - 'CMakePresets.json'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'wrangler.toml'
      - '.github/workflows/test.yml'
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'content/**'
      - 'worker/**'
      - 'website/**'
      - 'tests/**'
      - 'scripts/**'
      - 'CMakeLists.txt'
      - 'CMakePresets.json'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'wrangler.toml'
      - '.github/workflows/test.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repo-and-content:
    name: Repository & Content
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Check repository integrity
        run: python3 scripts/check_repository.py
      - name: Verify content packaging
        run: python3 tests/content/test_content_packages.py

  core:
    name: C++ Core (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Configure
        run: cmake -S . -B build-core -DSRP_BUILD_GUI=OFF -DBUILD_TESTING=ON -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build-core --config Release --parallel 2
      - name: Run CTest
        run: ctest --test-dir build-core -C Release --output-on-failure

  worker-and-website:
    name: Worker & Website
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: pnpm/action-setup@v6
        with:
          version: 11.3.0
          run_install: false
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Test Worker release proxy
        run: node --experimental-strip-types --test tests/worker/*.test.mjs
      - name: Test website download parsers
        run: node --experimental-strip-types --test tests/website/*.test.mjs
      - name: Typecheck website
        run: pnpm --filter srp-cfg-website lint

  console-data:
    name: Console Data Contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Run console unit tests
        run: python3 -m unittest discover -s tests/console -p "test_*.py"
      - name: Validate console dataset
        # Daily sync commits with --allow-stale so a Workers AI outage cannot
        # block upstream fact updates; keep pull requests strict.
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            python3 website/scripts/console/validate.py
          else
            python3 website/scripts/console/validate.py --allow-stale
          fi
      - name: Verify console index generation
        run: python3 website/scripts/console/build_index.py --output "$RUNNER_TEMP/console-index.json"
