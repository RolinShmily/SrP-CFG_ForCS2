name: Update CS2 Commands

on:
  schedule:
    # 每天凌晨 02:00 (UTC) 自动执行
    - cron: '0 2 * * *'
  workflow_dispatch:
    # 支持在 GitHub Actions 页面上手动触发

permissions:
  contents: write

jobs:
  update-commands:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      # 先跑零成本单元测试，再做真实 API 预检，最后才消耗批量配额。
      - name: Run command update unit tests
        run: |
          python .github/scripts/test_command_values.py
          python .github/scripts/test_update_commands.py
          python .github/scripts/test_ai_preflights.py

      # 用与正式流程相同的模型/参数/解析逻辑做一次真实调用，提前暴露凭据失效、
      # 模型下线、返回结构变化或中文质量退化（如把「你好」译成拼音）。
      - name: Pre-flight translation model
        env:
          CLOUDFLARE_AI_TOKEN: ${{ secrets.CLOUDFLARE_AI_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          python .github/scripts/test_cf_ai.py

      # 网站问答模型的预检刻意不放在这里：它与命令库更新毫无关系，一旦失败会连带
      # 阻断数据流水线（首次上线时就踩过）。它由 check-website-model.yml 单独把关。

      - name: Run update script
        env:
          CLOUDFLARE_AI_TOKEN: ${{ secrets.CLOUDFLARE_AI_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python .github/scripts/update_commands.py

      - name: Sync Vectorize index
        env:
          CLOUDFLARE_AI_TOKEN: ${{ secrets.CLOUDFLARE_AI_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          python .github/scripts/sync_vectorize.py

      - name: Commit and push if changed
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add app/website/public/data/commands.json .github/scripts/last_sha.txt .github/scripts/vectorize_sync_cache.json .github/scripts/command_values.py .github/scripts/test_command_values.py
          # 检查是否有文件改动，如果有则提交并推送
          if ! git diff --cached --quiet; then
            git commit -m "chore(auto): update CS2 console commands database"
            git push
          else
            echo "No changes detected in commands database."
          fi
