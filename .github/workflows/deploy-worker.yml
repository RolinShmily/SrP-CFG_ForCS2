name: Deploy Website & Packages to Cloudflare Worker

on:
  push:
    branches:
      - main
    paths:
      - 'config/**'
      - 'skills/**'
      - 'website/**'
      - '.github/workflows/deploy-worker.yml'
      - 'wrangler.toml'
      - 'scripts/package-website.py'
      - 'scripts/test_website_packages.py'
      - 'scripts/collect-licenses.mjs'
      - 'LICENSE'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: worker-production
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    name: Build & Deploy Static Worker
    timeout-minutes: 15
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.3.0
          run_install: false

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Package Configs & Agent Skill
        run: |
          python3 scripts/check_repository.py
          python3 scripts/test_website_packages.py
          python3 scripts/package-website.py

      - name: Validate Website
        run: |
          pnpm --filter srp-cfg-website test
          pnpm --filter srp-cfg-website lint

      - name: Collect dependency licenses
        run: node scripts/collect-licenses.mjs

      - name: Build Static Website
        run: pnpm --filter srp-cfg-website build

      - name: Deploy Cloudflare Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: "false"
        run: npm exec --yes --ignore-scripts --package=wrangler@4.147.0 -- wrangler deploy --config wrangler.toml
