name: Website Build & Deploy

on:
  push:
    branches:
      - main
    paths:
      - 'content/**'
      - 'website/**'
      - 'worker/**'
      - 'tests/worker/**'
      - '.github/workflows/deploy-worker.yml'
      - 'wrangler.toml'
      - 'scripts/check_repository.py'
      - 'scripts/package_content.py'
      - 'tests/content/test_content_packages.py'
      - 'website/scripts/collect-licenses.mjs'
      - 'LICENSE'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
  pull_request:
    branches:
      - main
    paths:
      - 'content/**'
      - 'website/**'
      - 'worker/**'
      - 'tests/worker/**'
      - '.github/workflows/deploy-worker.yml'
      - 'wrangler.toml'
      - 'scripts/check_repository.py'
      - 'scripts/package_content.py'
      - 'tests/content/test_content_packages.py'
      - 'website/scripts/collect-licenses.mjs'
      - 'LICENSE'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: website-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    name: Website build & deploy
    timeout-minutes: 30
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.3.0
          run_install: false

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Package Content Archives
        run: |
          python3 scripts/check_repository.py
          python3 tests/content/test_content_packages.py
          python3 scripts/package_content.py --output website/public

      - name: Validate Worker & Website
        run: |
          node --experimental-strip-types --test tests/worker/*.test.mjs
          pnpm --filter srp-cfg-website test
          pnpm --filter srp-cfg-website lint

      - name: Collect dependency licenses
        run: pnpm --filter srp-cfg-website licenses:collect

      - name: Build Static Website
        run: pnpm --filter srp-cfg-website build

      - name: Deploy Cloudflare Worker
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: "false"
        run: npm exec --yes --ignore-scripts --package=wrangler@4.147.0 -- wrangler deploy --config wrangler.toml
