name: Deploy Website & Config Packages to GitHub Pages

on:
  push:
    branches:
      - main
      - refactor
    paths:
      - 'config/**'
      - 'website/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:
    inputs:
      base_path:
        description: '网站子路径 BasePath（默认 /SrP-CFG_ForCS2；若绑定独立域名可填 /）'
        required: false
        default: '/SrP-CFG_ForCS2'

permissions:
  contents: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    name: Build Website & Config Packages to gh-pages
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.3.0
          run_install: false

      - name: Install Dependencies
        run: pnpm install --ignore-scripts

      - name: Package Incremental Config Bundles (srp-cfg, video, annotations)
        shell: bash
        run: |
          mkdir -p website/public/packages

          # 1. 打包 srp-cfg
          SRP_VER=$(cat config/srp-cfg/VERSION.txt | tr -d '\r\n ')
          mkdir -p /tmp/srp-stage
          cp -r config/srp-cfg /tmp/srp-stage/
          cp config/autoexec.cfg /tmp/srp-stage/
          (cd /tmp/srp-stage && zip -r -9 $GITHUB_WORKSPACE/website/public/packages/srp-cfg-v${SRP_VER}.zip .)
          cp website/public/packages/srp-cfg-v${SRP_VER}.zip website/public/packages/srp-cfg-latest.zip
          rm -rf /tmp/srp-stage

          # 2. 打包 video
          VIDEO_VER=$(cat config/video/VERSION.txt | tr -d '\r\n ')
          (cd config/video && zip -r -9 $GITHUB_WORKSPACE/website/public/packages/video-v${VIDEO_VER}.zip .)
          cp website/public/packages/video-v${VIDEO_VER}.zip website/public/packages/video-latest.zip

          # 3. 打包 annotations
          ANNO_VER=$(cat config/annotations/VERSION.txt | tr -d '\r\n ')
          (cd config/annotations && zip -r -9 $GITHUB_WORKSPACE/website/public/packages/annotations-v${ANNO_VER}.zip .)
          cp website/public/packages/annotations-v${ANNO_VER}.zip website/public/packages/annotations-latest.zip

          # 4. 计算哈希与大小并生成 packages.json 清单
          SRP_SHA=$(sha256sum website/public/packages/srp-cfg-latest.zip | awk '{print $1}')
          SRP_SIZE=$(stat -c%s website/public/packages/srp-cfg-latest.zip)
          VIDEO_SHA=$(sha256sum website/public/packages/video-latest.zip | awk '{print $1}')
          VIDEO_SIZE=$(stat -c%s website/public/packages/video-latest.zip)
          ANNO_SHA=$(sha256sum website/public/packages/annotations-latest.zip | awk '{print $1}')
          ANNO_SIZE=$(stat -c%s website/public/packages/annotations-latest.zip)
          PUB_DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          # 内容寻址，清单与下载不会因 latest.zip 的更新而错配。
          cp website/public/packages/srp-cfg-latest.zip website/public/packages/srp-cfg-v${SRP_VER}-${SRP_SHA}.zip
          cp website/public/packages/video-latest.zip website/public/packages/video-v${VIDEO_VER}-${VIDEO_SHA}.zip
          cp website/public/packages/annotations-latest.zip website/public/packages/annotations-v${ANNO_VER}-${ANNO_SHA}.zip

          cat <<EOF > website/public/packages.json
          {
            "schema_version": 1,
            "published_at": "${PUB_DATE}",
            "packages": {
              "srp-cfg": {
                "version": "${SRP_VER}",
                "size": ${SRP_SIZE},
                "sha256": "${SRP_SHA}",
                "url": "https://rolinshmily.github.io/SrP-CFG_ForCS2/packages/srp-cfg-v${SRP_VER}-${SRP_SHA}.zip",
                "cdn_url": "https://cdn.jsdelivr.net/gh/RolinShmily/SrP-CFG_ForCS2@gh-pages/packages/srp-cfg-latest.zip"
              },
              "video": {
                "version": "${VIDEO_VER}",
                "size": ${VIDEO_SIZE},
                "sha256": "${VIDEO_SHA}",
                "url": "https://rolinshmily.github.io/SrP-CFG_ForCS2/packages/video-v${VIDEO_VER}-${VIDEO_SHA}.zip",
                "cdn_url": "https://cdn.jsdelivr.net/gh/RolinShmily/SrP-CFG_ForCS2@gh-pages/packages/video-latest.zip"
              },
              "annotations": {
                "version": "${ANNO_VER}",
                "size": ${ANNO_SIZE},
                "sha256": "${ANNO_SHA}",
                "url": "https://rolinshmily.github.io/SrP-CFG_ForCS2/packages/annotations-v${ANNO_VER}-${ANNO_SHA}.zip",
                "cdn_url": "https://cdn.jsdelivr.net/gh/RolinShmily/SrP-CFG_ForCS2@gh-pages/packages/annotations-latest.zip"
              }
            }
          }
          EOF

      - name: Validate Website
        run: |
          pnpm --filter srp-cfg-website test
          pnpm --filter srp-cfg-website lint

      - name: Build Static Website
        env:
          DEPLOY_TARGET: gh-pages
          NEXT_PUBLIC_BASE_PATH: ${{ github.event.inputs.base_path || '/SrP-CFG_ForCS2' }}
        run: |
          pnpm --filter srp-cfg-website build
          touch website/out/.nojekyll

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./website/out
          publish_branch: gh-pages
          force_orphan: true
