name: Deploy Website

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
    paths:
      - 'app/website/**'
      - 'app/shared/**'
      - '.github/workflows/deploy-website.yml'
  workflow_dispatch:
    # 支持在 GitHub Actions 页面上手动触发

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Configure git to use HTTPS
        run: git config --global url."https://github.com/".insteadOf "git@github.com:"

      - name: Install dependencies
        run: pnpm install:web

      - name: Test AI stream handling
        run: pnpm --filter @srp-cfg/website test:ai-stream

      - name: Validate AI protection secrets
        env:
          PUBLIC_TURNSTILE_SITE_KEY: ${{ secrets.PUBLIC_TURNSTILE_SITE_KEY }}
          TURNSTILE_SECRET_KEY: ${{ secrets.CLOUDFLARE_TURNSTILE_SECRET || secrets.TURNSTILE_SECRET_KEY || '' }}
        run: |
          : "${PUBLIC_TURNSTILE_SITE_KEY:?PUBLIC_TURNSTILE_SITE_KEY is required}"
          : "${TURNSTILE_SECRET_KEY:?CLOUDFLARE_TURNSTILE_SECRET or TURNSTILE_SECRET_KEY is required}"

      - name: Build website
        env:
          PUBLIC_TURNSTILE_SITE_KEY: ${{ secrets.PUBLIC_TURNSTILE_SITE_KEY }}
          # 版本注入稳定性：srp-cfg-latest-version 插件构建期 fetch GitHub Releases
          # （app/website/src/data/version.ts），未认证仅 60 次/h/IP 会瞬时回落 0.0.0；
          # GITHUB_TOKEN 提供 5000 次/h 配额（见 tasks/PROGRESS.md 环境注意项）。
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm build:web

      - name: Deploy to Cloudflare Workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        working-directory: app/website
        run: npx wrangler deploy

      - name: Set Turnstile secret
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TURNSTILE_SECRET_KEY: ${{ secrets.CLOUDFLARE_TURNSTILE_SECRET || secrets.TURNSTILE_SECRET_KEY }}
        working-directory: app/website
        run: echo "$TURNSTILE_SECRET_KEY" | npx wrangler secret put TURNSTILE_SECRET_KEY
