name: Feature request
description: Suggest a new capability, preset, package entry, or website improvement.
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Please search existing issues first. For new presets, features, modes, or map
        guides, describe the gameplay scenario rather than only the convar values.

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Desktop app (Qt / QML)
        - CLI (srpcfg)
        - Config package (srp-cfg / video / annotations)
        - Website / Console
        - Build, CI, or packaging
        - Other
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: What are you trying to do, and what is missing or inconvenient today?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the behavior you expect. Mockups or example commands are welcome.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Existing configuration tricks, other tools, or workarounds.
    validations:
      required: false

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Links, screenshots, upstream references, or related issues.
    validations:
      required: false

  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues and this is not a duplicate.
          required: true
