name: Bug report
description: Report a reproducible problem in the app, CLI, config packages, or website.
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please search existing issues first.
        For security vulnerabilities, follow [SECURITY.md](https://github.com/RolinShmily/SrP-CFG_ForCS2/blob/main/SECURITY.md)
        instead of opening a public issue.

  - type: dropdown
    id: area
    attributes:
      label: Area
      description: Which part of the project is affected?
      options:
        - Desktop app (Qt / QML)
        - CLI (srpcfg)
        - Config package (srp-cfg / video / annotations)
        - Website / Console
        - Build, CI, or packaging
        - Other
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `srpcfg version`, the release tag, or the website commit.
      placeholder: "3.4.9"
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Windows 11
        - Windows 10
        - Linux
        - Other
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Provide the smallest sequence that reliably triggers the problem.
      placeholder: |
        1. Open ...
        2. Select ...
        3. Observe ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Remove Steam paths, tokens, and personal data before pasting.
      render: text
    validations:
      required: false

  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues and this is not a duplicate.
          required: true
        - label: I am using the latest release or a recent `main` build.
          required: true
