name: Bug Report
description: Something is broken or behaves unexpectedly. / 功能异常或行为不符合预期。
title: "[Bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. English and 中文 are both welcome.

        Before filing, please check whether a fix is already available in the
        [latest release](https://github.com/RolinShmily/SrP-CFG_ForCS2/releases/latest)
        and search [existing issues](https://github.com/RolinShmily/SrP-CFG_ForCS2/issues?q=is%3Aissue).

        For security problems, use
        [private reporting](https://github.com/RolinShmily/SrP-CFG_ForCS2/security/advisories/new) instead.

  - type: dropdown
    id: component
    attributes:
      label: Affected component
      description: Which part of the project is misbehaving?
      options:
        - Desktop suite (installer / updater / app)
        - Config packages (Runtime Core CFG, presets, modes, features)
        - Map annotations (Map Guides)
        - Video settings package
        - Website / docs / command center
        - CI, release pipeline or scripting
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: SrP-CFG version
      description: Shown in the app's About page, or the release tag you downloaded.
      placeholder: "v3.3.1"
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Environment
      description: Windows version, plus your CS2 / Steam install type if relevant.
      placeholder: "Windows 11 23H2 · Steam library on D:\\SteamLibrary"
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear and concise description of the bug.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Numbered steps. Include the exact console command or UI path.
      placeholder: |
        1. Open the app → Component Installation
        2. Select Runtime Core and click Deploy
        3. ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected vs actual behavior
      value: |
        **Expected:**


        **Actual:**
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: Logs or screenshots
      description: |
        Paste the app's log output, the in-game console output
        (`srp_help` and any related lines), or attach screenshots.
        Redact your SteamID64 / account name if you prefer.
    validations:
      required: false

  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I am running the latest release.
          required: true
        - label: I searched existing issues and found no duplicate.
          required: true
        - label: I have not included any secrets, tokens or private credentials above.
          required: true
