// ══════════════════════════════════════════════════════════════════
// SrP-CFG v3 bootstrap (CS:GO edition)
//
// 安装方法 / Installation:
// 1. 将 srp-cfg-csgo 文件夹与本文件一起复制到 CS:GO 的 csgo/cfg/ 目录。
// 2. 在 CS:GO 的 csgo/cfg/ 目录下将本文件重命名为 autoexec.cfg（或合并进现有 autoexec.cfg）。
// 3. 在启动项可加 +exec autoexec.cfg 以确保稳定自启。
// ══════════════════════════════════════════════════════════════════

exec srp-cfg-csgo/runtime/init.cfg      // 注册 Runtime、alias、crosshair-view 与 practice。
exec srp-cfg-csgo/user/custom.cfg       // 最后执行用户 Preset 起点与个人覆盖。
host_writeconfig                        // 将本次应用的按键与存档参数写入 CS:GO config.cfg。
