// Knife has no physical keymap or persistent preference; this refreshes its command library (CS:GO).
sv_cheats 1 // 开启作弊模式（give 与 ent_fire 必需）。
mp_drop_knife_enable 1 // 允许按 G 丢弃当前匕首以便拾取地面生成的新刀。
exec srp-cfg-csgo/features/knife/runtime.cfg // 加载匕首模型切换的 Runtime 命令。
echo "[SrP-CFG] Knife ready (CS:GO). Hold/release J briefly to cycle; in console run kk (or press G to drop) then 500-525/59."
