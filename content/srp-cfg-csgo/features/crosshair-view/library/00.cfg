// SrP-CFG 准星预设 00（CS:GO 经典参数）；修改后可在控制台执行 c00 立即预览。
cl_crosshair_drawoutline "0" // 关闭线条外缘描边。
cl_crosshair_dynamic_maxdist_splitratio "0.300000" // 动态准星内外线段分配比例。
cl_crosshair_dynamic_splitalpha_innermod "1.000000" // 动态准星内侧线段透明度倍率。
cl_crosshair_dynamic_splitalpha_outermod "0.500000" // 动态准星外侧线段透明度倍率。
cl_crosshair_dynamic_splitdist "7" // 动态准星开始分离的距离阈值。
cl_crosshair_outlinethickness "1.000000" // 准星描边粗细。
cl_crosshair_t "0" // 关闭 T 形准星（保留上方线段）。
cl_crosshairalpha "255" // 准星 Alpha 透明度（0–255）。
cl_crosshaircolor "5" // 颜色模式 5（自定义 RGB）。
cl_crosshaircolor_b "255" // 自定义蓝色通道。
cl_crosshaircolor_g "255" // 自定义绿色通道。
cl_crosshaircolor_r "255" // 自定义红色通道。
cl_crosshairdot "0" // 隐藏中心点。
cl_crosshairgap "-3.400000" // 准星中心间距。
cl_crosshairgap_useweaponvalue "0" // 禁用按武器变化的准星间距。
cl_crosshairsize "0.900000" // 准星线段长度。
cl_crosshairstyle "4" // 经典静态样式。
cl_crosshairthickness "0.800000" // 准星线段粗细。
cl_crosshairusealpha "1" // 启用自定义透明度。
