// ─── SrP-CFG Preset Layer (CS:GO) ───
// 第一步：如果需要应用 SrP Default 推荐基线，删除下面 srp_apply_default 行开头的 //。
// 如果完全保留游戏内现有设置与 config.cfg，也可以保持注释不启用。
//
// srp_apply_default
//
// 想从 Valve CS:GO 基线重新测试：控制台执行 srp_reset_valve
// ─── Preset Layer End ───

// ─── SrP-CFG User Layer ───
// 第二步：把自己的灵敏度、准星、HUD、声音、按键和 alias 写在所选命令下面。
// 后面的命令会覆盖 Preset 中的同名设置；不要直接修改 runtime/features/modes/presets。
//
// 示例（删除行首 // 后生效）：
// sensitivity 1.00
// c06
// cyan
// bind "mouse4" "+voicerecord"
// alias "mypractice" "srp_practice_keys"
//
// 修改并保存本文件后执行 srp_reload，再应用“Preset 起点 → 个人差异”。
// ─── User Layer End ───
