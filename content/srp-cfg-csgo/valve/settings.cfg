// Valve CS:GO baseline for every ConVar touched by srp-cfg-csgo.
// CS2-only ConVars are omitted; unknown config.cfg and video.txt fields are untouched.

// Mouse and viewmodel
sensitivity 2.5                             // Valve CS:GO 默认鼠标灵敏度。
zoom_sensitivity_ratio_mouse 1.0            // 标准开镜灵敏度倍率。
m_yaw 0.022                                 // 标准鼠标水平转向系数。
m_rawinput 1                                // 默认原始鼠标输入。
viewmodel_fov 60                            // Valve 默认持枪视角 FOV。
viewmodel_offset_x 1                        // 默认持枪视角水平偏移。
viewmodel_offset_y 1                        // 默认持枪视角纵深偏移。
viewmodel_offset_z -1                       // 默认持枪视角垂直偏移。
viewmodel_presetpos 1                       // Valve 桌面端默认持枪视角预设。

// Crosshair (CS:GO classic baseline)
crosshair 1 // 启用游戏准星。
cl_crosshair_drawoutline 1 // 开启准星描边。
cl_crosshair_dynamic_maxdist_splitratio 0.35 // 动态准星最大扩散分段比例。
cl_crosshair_dynamic_splitalpha_innermod 1 // 动态准星内层透明度倍率。
cl_crosshair_dynamic_splitalpha_outermod 0.5 // 动态准星外层透明度倍率。
cl_crosshair_dynamic_splitdist 7 // 动态准星内外层分离距离。
cl_crosshair_friendly_warning 1 // 瞄准队友时的友军警告。
cl_crosshair_outlinethickness 1 // 准星描边粗细。
cl_crosshair_sniper_width 1 // 狙击镜中心线粗细。
cl_crosshair_sniper_show_normal_inaccuracy 0 // 狙击镜静止模糊提示。
cl_crosshair_t 0 // 关闭 T 形准星。
cl_crosshairalpha 200 // 准星透明度。
cl_crosshaircolor 1 // 准星颜色（默认绿色）。
cl_crosshaircolor_r 50 // 自定义红色通道。
cl_crosshaircolor_g 250 // 自定义绿色通道。
cl_crosshaircolor_b 50 // 自定义蓝色通道。
cl_crosshairdot 0 // 关闭准星中心点。
cl_crosshairgap 1 // 准星中心间距。
cl_crosshairgap_useweaponvalue 0 // 禁用按武器变化的准星间距。
cl_crosshairsize 5 // 准星线段长度。
cl_crosshairstyle 2 // 经典默认动态样式。
cl_crosshairthickness 0.5 // 准星线段粗细。
cl_crosshairusealpha 1 // 启用自定义透明度。
cl_fixedcrosshairgap 3 // 固定样式中心间距。
cl_observed_bot_crosshair 0 // 观察 Bot 时的准星模式。
cl_show_observer_crosshair 2 // 观察玩家时的准星显示模式。

// Radar and HUD
cl_radar_always_centered 1 // 雷达始终以玩家为中心。
cl_radar_icon_scale_min 0.6 // 雷达图标最小缩放。
cl_radar_rotate 1 // 雷达跟随视角旋转。
cl_radar_scale 0.7 // 雷达地图缩放比例。
cl_radar_square_with_scoreboard 1 // 计分板打开时切换方形雷达。
cl_hud_background_alpha 0.5 // HUD 背景透明度。
cl_hud_radar_scale 1 // HUD 雷达尺寸。
cl_hud_color 0 // HUD 主题颜色。
hud_scaling 0.85 // CS:GO 默认 HUD 整体缩放。
hud_showtargetid 1 // 准星目标 ID 显示。
safezonex 1.0 // HUD 水平安全区比例。
safezoney 1.0 // HUD 垂直安全区比例。
cl_showloadout 1 // 常驻显示装备栏。
cl_hud_playercount_showcount 0 // 顶部队伍栏显示头像。
cl_teamid_overhead_always 0 // 队友头顶常驻标识默认关闭。
cl_teammate_colors_show 1 // 雷达队友颜色显示模式。
cl_color 0 // 玩家队伍颜色编号。

// Telemetry and visual feedback
net_graph 0 // 默认关闭网络监视面板。
net_graphproportionalfont 1 // 默认按比例字体。
r_drawtracers_firstperson 1 // 第一人称曳光弹。
mat_monitorgamma 2.2 // 默认显示器 Gamma 值。
func_break_max_pieces 15 // 可破坏物碎片数量。
spec_replay_autostart 1 // 阵亡回放自动播放。
spec_show_xray 1 // 观察模式 X 光显示。

// Input and general behavior
cl_autohelp 1 // 自动帮助提示。
gameinstructor_enable 0 // 游戏教学提示。
cl_righthand 1 // 默认右手持枪。
cl_autowepswitch 1 // 拾取更强武器时自动切换。
cl_use_opens_buy_menu 1 // 默认使用键可打开购买菜单。
cl_dm_buyrandomweapons 1 // 死斗默认随机购枪。
con_enable 1 // 启用开发者控制台。
fps_max 400 // CS:GO 后期版本默认帧率上限。
mm_dedicated_search_maxping 150 // 匹配允许的最大延迟。

// Audio
volume 1.0 // 游戏主音量。
snd_menumusic_volume 1.0 // 主菜单音乐音量。
snd_roundstart_volume 1.0 // 回合开始音乐音量。
snd_roundend_volume 1.0 // 回合结束音乐音量。
snd_mvp_volume 1.0 // MVP 音乐音量。
snd_mapobjective_volume 1.0 // 炸弹或人质目标音乐音量。
snd_tensecondwarning_volume 1.0 // 十秒警告音乐音量。
snd_deathcamera_volume 1.0 // 死亡视角音乐音量。
snd_mute_mvp_music_live_players 0 // 存活玩家仍在时是否静音 MVP。
snd_mute_losefocus 1 // 失去焦点时静音。
voice_enable 1 // 启用语音通信。

// Chat wheel defaults
cl_radial_radio_tap_to_ping 1 // 快捷轮盘轻点直接标记。
cl_radial_radio_tab 0 // 默认快捷轮盘页。
cl_radial_radio_tab_0_text_1 "#Chatwheel_quiet"
cl_radial_radio_tab_0_text_2 "#Chatwheel_requestecoround"
cl_radial_radio_tab_0_text_3 "#Chatwheel_bplan"
cl_radial_radio_tab_0_text_4 "#Chatwheel_requestweapon"
cl_radial_radio_tab_0_text_5 "#Chatwheel_midplan"
cl_radial_radio_tab_0_text_6 "#Chatwheel_droppedbomb"
cl_radial_radio_tab_0_text_7 "#Chatwheel_aplan"
cl_radial_radio_tab_0_text_8 "#Chatwheel_requestspend"
cl_radial_radio_tab_1_text_1 "#Chatwheel_bombcarrierspotted"
cl_radial_radio_tab_1_text_2 "#Chatwheel_requestecoround"
cl_radial_radio_tab_1_text_3 "#Chatwheel_multipleenemieshere"
cl_radial_radio_tab_1_text_4 "#Chatwheel_requestweapon"
cl_radial_radio_tab_1_text_5 "#Chatwheel_rotatetome"
cl_radial_radio_tab_1_text_6 "#Chatwheel_ihavethebomb"
cl_radial_radio_tab_1_text_7 "#Chatwheel_oneenemyhere"
cl_radial_radio_tab_1_text_8 "#Chatwheel_requestspend"
cl_radial_radio_tab_2_text_1 "#Chatwheel_bombcarrierspotted"
cl_radial_radio_tab_2_text_2 "#Chatwheel_requestecoround"
cl_radial_radio_tab_2_text_3 "#Chatwheel_multipleenemieshere"
cl_radial_radio_tab_2_text_4 "#Chatwheel_requestweapon"
cl_radial_radio_tab_2_text_5 "#Chatwheel_rotatetome"
cl_radial_radio_tab_2_text_6 "#Chatwheel_ihavethebomb"
cl_radial_radio_tab_2_text_7 "#Chatwheel_oneenemyhere"
cl_radial_radio_tab_2_text_8 "#Chatwheel_requestspend"

// Non-archived session state touched by srp-cfg-csgo aliases/modes
cl_drawhud 1 // 完整 HUD 显示。
cl_draw_only_deathnotices 0 // 仅显示击杀与准星关闭。
cl_drawhud_force_radar 0 // 强制雷达状态默认。
fov_cs_debug 0 // 调试视野 FOV 偏移归零。
cl_showpos 0 // 隐藏坐标速度面板。
sv_grenade_trajectory 0 // 关闭投掷轨迹绘制。
cl_grenadepreview 0 // 关闭投掷物实时落点预览。
r_drawothermodels 1 // 恢复正常模型渲染。
host_timescale 1 // 恢复正常时间倍率。
firstperson // 恢复第一人称视角。

echo "[SrP-CFG] Valve CS:GO preference baseline applied; unknown config.cfg and video.txt fields were not touched."
