// Raw Valve CS:GO baseline reset. user/custom.cfg is intentionally not re-applied here.
exec srp-cfg-csgo/valve/settings.cfg // 恢复 SrP 涉及字段的 CS:GO Valve 默认基线。
exec srp-cfg-csgo/valve/keymap.cfg   // 调用游戏自带 binddefaults 恢复键位。
echo [SrP-CFG] Valve CS:GO baseline reset complete. Run srp_reload to return to the normal startup stack.
