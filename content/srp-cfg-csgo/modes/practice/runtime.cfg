// Persistent practice command vocabulary (CS:GO edition). No server state or physical key is changed here.
alias "+Pucci" "host_timescale 25"          // Hold: accelerate time.
alias "-Pucci" "host_timescale 1"           // Release: restore normal time.
alias "switch-impactsNpreview" "impactsNpreview-on" // 转发到弹痕与投掷物落点预览开启。
alias "impactsNpreview-on" "sv_showimpacts 1;cl_grenadepreview 1;alias switch-impactsNpreview impactsNpreview-off;echo Impacts and grenade preview ON!" // 开启弹痕与 CS:GO 实时投掷落点预览。
alias "impactsNpreview-off" "sv_showimpacts 0;cl_grenadepreview 0;alias switch-impactsNpreview impactsNpreview-on;echo Impacts and grenade preview OFF!" // 关闭弹痕与 CS:GO 实时投掷落点预览。
alias "switchperson" "switchperson-third" // 切换第一/第三人称视角。
alias "switchperson-third" "thirdperson;alias switchperson switchperson-first;echo Third person ON!" // 切换到第三人称视角。
alias "switchperson-first" "firstperson;alias switchperson switchperson-third;echo First person ON!" // 切回第一人称视角。
alias "spawn" "exec srp-cfg-csgo/modes/practice/spawn/spawn.cfg" // 加载地图出生点传送表。
alias "gkd" "mp_respawn_on_death_ct 0;mp_respawn_on_death_t 0;sv_showimpacts 0;sv_grenade_trajectory 0;cl_grenadepreview 0;sv_infinite_ammo 0;sv_alltalk 0;mp_buy_anywhere 0;mp_freezetime 4;mp_restartgame 1;sv_cheats 0;echo Standard match mode!" // 切回标准实战参数。
alias "gg" "sv_cheats 1;mp_respawn_on_death_ct 1;mp_respawn_on_death_t 1;sv_showimpacts 1;sv_grenade_trajectory 1;sv_infinite_ammo 1;sv_alltalk 1;mp_buy_anywhere 1;mp_freezetime 1;echo Practice mode restored!" // 恢复跑图模式。
alias "plant" "mp_plant_c4_anywhere 1;echo Plant anywhere ON!" // 允许在任意地点安放 C4。
alias "xray" "toggle spec_show_xray 0 1;echo X-ray toggled!" // 切换观察者 X 光。

alias "srp_prac_armor" "give item_assaultsuit;echo Armor added!" // 补充头盔与护甲。
alias "srp_prac_regen" "toggle sv_regeneration_force_on 0 1;echo Auto regen toggled!" // 切换自动回血。
alias "srp_prac_bot_add" "bot_add;mp_death_drop_gun 0;echo Bot added!" // 添加 Bot。
alias "srp_prac_bot_crouch" "toggle bot_crouch;echo Bot crouch toggled!" // 切换 Bot 蹲伏。
alias "srp_prac_bot_mimic" "toggle bot_mimic 0 1;echo Bot mimic toggled!" // 切换 Bot 模仿（CS:GO 模仿玩家 1）。
alias "srp_prac_fov" "toggle fov_cs_debug 0 30;echo FOV toggled!" // 切换广角调试视野。
alias "srp_prac_bot_kick" "bot_kick;mp_death_drop_gun 1;echo All bots kicked!" // 踢出所有 Bot。
alias "srp_prac_teammates_enemies" "toggle mp_teammates_are_enemies 0 1;echo Teammates as enemies toggled!" // 切换队友互为敌人。
alias "srp_prac_bhop" "toggle sv_enablebunnyhopping;toggle sv_autobunnyhopping;toggle cl_showpos;toggle sv_airaccelerate 1000 12;echo Bhop toggled!" // 切换连跳模式。
alias "srp_prac_showpos" "toggle cl_showpos 0 1" // 切换坐标速度显示。
alias "srp_prac_rethrow" "sv_rethrow_last_grenade;echo Last grenade rethrown!" // 重新投掷上一颗投掷物。
alias "srp_prac_noclip" "noclip" // 切换飞行模式。
alias "srp_prac_clear_grenades" "ent_fire smokegrenade_projectile kill;ent_fire flashbang_projectile kill;ent_fire incgrenade_projectile kill;ent_fire molotov_projectile kill;ent_fire hegrenade_projectile kill;ent_fire decoy_projectile kill;ent_fire inferno kill;stopsound;echo Grenades cleared!" // 清除场上道具与火焰并停止残余音效。
alias "srp_prac_aoproxy" "toggle r_drawothermodels 2 1;echo Wireframe models toggled!" // CS:GO 下用线框模型替代实体代理显示。
alias "srp_prac_infammo" "toggle sv_infinite_ammo 1 2;echo Infinite ammo toggled!" // 切换无限弹匣与无限备弹。
alias "srp_prac_teamid" "toggle cl_teamid_overhead_always 1 2" // 切换队友头顶标识显示模式（CS:GO）。
alias "srp_prac_bot_kill" "bot_kill;echo All bots killed!" // 处死所有 Bot。
alias "srp_prac_restart" "mp_restartgame 1;mp_death_drop_gun 1;echo Game restarting in 1 second!" // 重启训练回合。
alias "srp_prac_bot_place" "bot_stop 1;bot_place;echo Bot placed!" // 放置并冻结 Bot。
