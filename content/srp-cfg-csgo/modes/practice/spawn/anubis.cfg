// Anubis出生点配置（CS:GO 实测点位；仅收录已核实 CS:GO 坐标的出生点）
// 初始化所有出生点
exec srp-cfg-csgo/modes/practice/spawn/init_spawns.cfg // 重置出生点别名，避免切图后残留旧坐标。

// 设置可用的出生点（setpos_exact 已由 CS:GO getpos Z 减去 64 眼高得到地面原点）
alias "CT1" "setpos_exact -400.00 2192.00 -41.65;setang 0 240 0;echo Teleported to: Anubis - CT 1"
alias "CT2" "setpos_exact -560.00 2192.00 -41.65;setang 0 285 0;echo Teleported to: Anubis - CT 2"
alias "CT3" "setpos_exact -476.00 2216.00 -35.72;setang 0 270 0;echo Teleported to: Anubis - CT 3"

alias "T1" "setpos_exact -240.00 -1696.00 2.03;setang 0 90 0;echo Teleported to: Anubis - T 1"
alias "T2" "setpos_exact -352.00 -1696.00 2.03;setang 0 90 0;echo Teleported to: Anubis - T 2"
alias "T3" "setpos_exact -416.00 -1608.00 -4.44;setang 0 150 0;echo Teleported to: Anubis - T 3"
alias "T4" "setpos_exact -304.00 -1608.00 -11.97;setang 0 135 0;echo Teleported to: Anubis - T 4"
alias "T5" "setpos_exact -192.00 -1608.00 -11.97;setang 0 90 0;echo Teleported to: Anubis - T 5"

echo "Map: Anubis (CS:GO) | CT: 3 verified spawns | T: 5 verified spawns"
