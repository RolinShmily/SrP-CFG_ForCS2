// Italy出生点配置（延续上游 srp-cfg 占位坐标）
// 初始化所有出生点
exec srp-cfg-csgo/modes/practice/spawn/init_spawns.cfg // 重置出生点别名，避免切图后残留旧坐标。

// 设置可用的出生点（注：此处与原版 srp-cfg 一致，使用近似占位坐标）
alias "CT1" "setpos_exact 1200 2300 100;setang 0 270 0;echo Teleported to: Italy - CT 1"
alias "CT2" "setpos_exact 1200 2200 100;setang 0 270 0;echo Teleported to: Italy - CT 2"
alias "CT3" "setpos_exact 1200 2100 100;setang 0 270 0;echo Teleported to: Italy - CT 3"
alias "CT4" "setpos_exact 1100 2250 100;setang 0 270 0;echo Teleported to: Italy - CT 4"
alias "CT5" "setpos_exact 1100 2150 100;setang 0 270 0;echo Teleported to: Italy - CT 5"

alias "T1" "setpos_exact -1200 800 100;setang 0 90 0;echo Teleported to: Italy - T 1"
alias "T2" "setpos_exact -1200 700 100;setang 0 90 0;echo Teleported to: Italy - T 2"
alias "T3" "setpos_exact -1200 600 100;setang 0 90 0;echo Teleported to: Italy - T 3"
alias "T4" "setpos_exact -1100 750 100;setang 0 90 0;echo Teleported to: Italy - T 4"
alias "T5" "setpos_exact -1100 650 100;setang 0 90 0;echo Teleported to: Italy - T 5"

echo "Map: Italy (CS:GO placeholder) | CT: 5 spawns | T: 5 spawns"
