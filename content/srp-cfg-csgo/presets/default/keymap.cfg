// SrP recommended keymap example (CS:GO edition). Runtime owns every referenced alias.

// Movement and combat
bind "w" "+forward" // 向前移动。
bind "s" "+back" // 向后移动。
bind "a" "+moveleft" // 向左平移（CS:GO 对应指令）。
bind "d" "+moveright" // 向右平移（CS:GO 对应指令）。
bind "mouse1" "+attack" // 普通攻击。
bind "mouse2" "+attack2" // 辅助开火或开镜。
bind "e" "+use" // 使用或互动。
bind "r" "+reload" // 装填弹药。
bind "f" "+lookatweapon" // 检视武器。
bind "space" "+jump" // 跳跃。
bind "ctrl" "+duck" // 蹲下。
bind "tab" "+showscores" // 显示计分板。
bind "g" "drop" // 丢弃当前物品。
bind "m" "teammenu" // 打开队伍选择菜单。
bind "shift" "+speed" // 静步移动（CS:GO 对应指令）。
bind "b" "buymenu" // 打开购买菜单。

// Weapon and grenade slots
bind "1" "slot1" // 切换主武器。
bind "2" "slot2" // 切换副武器。
bind "3" "slot3" // 切换匕首与电击枪槽。
bind "4" "slot4" // 切换投掷物选择槽。
bind "5" "slot5" // 切换 C4。
bind "6" "slot9" // 切换诱饵弹。
bind "z" "slot6" // 切换高爆手雷。
bind "x" "slot7" // 切换闪光弹。
bind "c" "slot8" // 切换烟雾弹。
bind "v" "slot10" // 切换燃烧弹。
bind "q" "lastinv" // 切换到上一个武器。
bind "=" "slot12" // 切换医疗针槽。
bind "'" "radio2" // 打开无线电菜单。

// Communication and common actions
bind "y" "+spray_menu" // 打开喷漆菜单。
bind "u" "messagemode" // 打开全局聊天。
bind "i" "messagemode2" // 打开团队聊天。
bind "mwheelup" "invprev" // 选择上一个物品。
bind "mwheeldown" "+jump" // 滚轮跳跃。
bind "mouse4" "+voicerecord" // 按住进行语音通信。
bind "mouse3" "player_ping" // 放置玩家标记。
bind "alt" "+radialradio" // 打开快捷聊天轮盘。
bind "ralt" "noclip" // 切换飞行模式（本地训练）。
bind "`" "toggleconsole" // 打开或关闭开发者控制台。
bind "h" "toggle cl_righthand 0 1" // 切换左右手持枪（CS:GO）。
bind "t" "toggle cl_radar_scale 0.37 0.7" // 切换雷达缩放比例（CS:GO）。

// Buy shortcuts; F1/F2 remain intentionally unbound. (CS:GO uses explicit weapon names.)
unbind "f1" // 清除 f1 的旧绑定，避免与当前键位方案冲突。
unbind "f2" // 清除 f2 的旧绑定，避免与当前键位方案冲突。
bind "f3" "buy deagle" // 购买沙漠之鹰（CS:GO 无 secondary4 槽位名）。
bind "f4" "buy ak47;buy m4a1" // 购买主力步枪（T 买 AK-47 / CT 买当前装备的 M4）。
bind "f5" "buy hegrenade" // 购买高爆手雷。
bind "f6" "buy flashbang" // 购买闪光弹。
bind "f7" "buy smokegrenade" // 购买烟雾弹。
bind "f8" "buy molotov;buy incgrenade" // 购买燃烧瓶或燃烧弹。
bind "f9" "buy vest" // 购买防弹衣。
bind "f10" "buy vesthelm" // 购买防弹衣与头盔。
bind "f11" "buy defuser" // 购买拆弹器。
bind "del" "toggle volume 0.10 1.00" // 在低音量与正常音量之间切换。
bind "k" "say_team !drop" // 向平台队友发送发刀指令。
bind "\" "say_team .hp" // 向 5E 团队聊天发送伤害统计指令。
bind "n" "toggle cl_teamid_overhead_always 1 2" // 切换队友头顶标识模式（CS:GO）。

// SrP feature and mode entry keys
bind "-" "keyhud" // 切换精简 HUD。
bind "7" "keyc" // 循环切换准星预设。
bind "8" "keyv" // 循环切换持枪视角预设。
bind "o" "srp_reload" // 重新载入 CS:GO Runtime 与用户配置。
bind "j" "srp_knife_keys" // 切换匕首模型（CS:GO 本地作弊环境）。
bind "p" "srp_practice_keys" // 进入跑图模式并应用键位。

