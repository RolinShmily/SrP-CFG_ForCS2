// SrP-CFG reusable aliases (CS:GO edition).
// These definitions belong to Runtime so config.cfg-synced bindings keep working across sessions.

alias "keyhud" "pvp-hud-off" // 将 alias keyhud 转发到 pvp-hud-off。
alias "pvp-hud-off" "cl_draw_only_deathnotices 1;cl_drawhud_force_radar 1;alias keyhud pvp-hud-on;echo Switched to PVP HUD: death notices, crosshair and radar only!" // 仅保留死亡信息、准星与雷达。
alias "pvp-hud-on" "cl_draw_only_deathnotices 0;cl_drawhud_force_radar 0;alias keyhud pvp-hud-off;echo Switched to PVP HUD: show everything!" // 恢复完整 HUD 显示。

alias "tick" "toggle net_graph 1 0;status" // CS:GO 下切换网络状态监视并输出服务器信息。
