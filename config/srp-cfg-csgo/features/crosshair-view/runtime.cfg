// Persistent crosshair/viewmodel command vocabulary (CS:GO edition).
// Runtime loads this file every launch so config.cfg-synced alias bindings remain valid.
alias "srp_crosshair_custom_info" "echo Custom crosshair in use." // 输出自定义准星提示。
alias "srp_viewmodel_custom_info" "echo Custom viewmodel in use." // 输出自定义持枪视角提示。
alias "whoamic" "srp_crosshair_custom_info" // 记录当前准星说明入口。
alias "whoamiv" "srp_viewmodel_custom_info" // 记录当前持枪视角说明入口。
alias "keyc" "c00" // 默认准星循环起点。
alias "keyv" "v00" // 默认持枪视角循环起点。
alias "srp_restore_c" "exec srp-cfg-csgo/features/crosshair-view/library/00.cfg" // 记录 switchthrow 关闭后要恢复的准星预设。

alias "srp_c00_info" "echo Crosshair preset c00 (default)." // 输出 c00 提示。
alias "srp_c01_info" "echo Crosshair preset c01." // 输出 c01 提示。
alias "srp_c02_info" "echo Crosshair preset c02." // 输出 c02 提示。
alias "srp_c03_info" "echo Crosshair preset c03." // 输出 c03 提示。
alias "srp_c04_info" "echo Crosshair preset c04." // 输出 c04 提示。
alias "srp_c05_info" "echo Crosshair preset c05." // 输出 c05 提示。
alias "srp_c06_info" "echo Crosshair preset c06." // 输出 c06 提示。
alias "srp_c07_info" "echo Crosshair preset c07." // 输出 c07 提示。

alias "c00" "exec srp-cfg-csgo/features/crosshair-view/library/00.cfg;srp_c00_info;alias whoamic srp_c00_info;alias srp_restore_c exec srp-cfg-csgo/features/crosshair-view/library/00.cfg;alias keyc c01" // 应用 c00，更新状态与下一档。
alias "c01" "exec srp-cfg-csgo/features/crosshair-view/library/01.cfg;srp_c01_info;alias whoamic srp_c01_info;alias srp_restore_c exec srp-cfg-csgo/features/crosshair-view/library/01.cfg;alias keyc c02" // 应用 c01，更新状态与下一档。
alias "c02" "exec srp-cfg-csgo/features/crosshair-view/library/02.cfg;srp_c02_info;alias whoamic srp_c02_info;alias srp_restore_c exec srp-cfg-csgo/features/crosshair-view/library/02.cfg;alias keyc c03" // 应用 c02，更新状态与下一档。
alias "c03" "exec srp-cfg-csgo/features/crosshair-view/library/03.cfg;srp_c03_info;alias whoamic srp_c03_info;alias srp_restore_c exec srp-cfg-csgo/features/crosshair-view/library/03.cfg;alias keyc c04" // 应用 c03，更新状态与下一档。
alias "c04" "exec srp-cfg-csgo/features/crosshair-view/library/04.cfg;srp_c04_info;alias whoamic srp_c04_info;alias srp_restore_c exec srp-cfg-csgo/features/crosshair-view/library/04.cfg;alias keyc c05" // 应用 c04，更新状态与下一档。
alias "c05" "exec srp-cfg-csgo/features/crosshair-view/library/05.cfg;srp_c05_info;alias whoamic srp_c05_info;alias srp_restore_c exec srp-cfg-csgo/features/crosshair-view/library/05.cfg;alias keyc c06" // 应用 c05，更新状态与下一档。
alias "c06" "exec srp-cfg-csgo/features/crosshair-view/library/06.cfg;srp_c06_info;alias whoamic srp_c06_info;alias srp_restore_c exec srp-cfg-csgo/features/crosshair-view/library/06.cfg;alias keyc c07" // 应用 c06，更新状态与下一档。
alias "c07" "exec srp-cfg-csgo/features/crosshair-view/library/07.cfg;srp_c07_info;alias whoamic srp_c07_info;alias srp_restore_c exec srp-cfg-csgo/features/crosshair-view/library/07.cfg;alias keyc c00" // 应用 c07，更新状态并回到 c00。

alias "srp_v00_info" "echo Viewmodel preset v00 (default)." // 输出 v00 提示。
alias "srp_v01_info" "echo Viewmodel preset v01." // 输出 v01 提示。
alias "srp_v02_info" "echo Viewmodel preset v02." // 输出 v02 提示。
alias "srp_v03_info" "echo Viewmodel preset v03." // 输出 v03 提示。
alias "srp_v04_info" "echo Viewmodel preset v04." // 输出 v04 提示。
alias "srp_v05_info" "echo Viewmodel preset v05." // 输出 v05 提示。
alias "srp_v06_info" "echo Viewmodel preset v06." // 输出 v06 提示。
alias "srp_v07_info" "echo Viewmodel preset v07." // 输出 v07 提示。

alias "v00" "viewmodel_fov 68;viewmodel_offset_x 2;viewmodel_offset_y 2;viewmodel_offset_z -1;viewmodel_presetpos 0;srp_v00_info;alias whoamiv srp_v00_info;alias keyv v01" // 应用持枪视角预设 v00。
alias "v01" "viewmodel_fov 60;viewmodel_offset_x 0;viewmodel_offset_y 1;viewmodel_offset_z -2;viewmodel_presetpos 0;srp_v01_info;alias whoamiv srp_v01_info;alias keyv v02" // 应用持枪视角预设 v01。
alias "v02" "viewmodel_fov 68;viewmodel_offset_x 2.5;viewmodel_offset_y -1;viewmodel_offset_z -2;viewmodel_presetpos 0;srp_v02_info;alias whoamiv srp_v02_info;alias keyv v03" // 应用持枪视角预设 v02。
alias "v03" "viewmodel_fov 68;viewmodel_offset_x 1.5;viewmodel_offset_y -2;viewmodel_offset_z -2;viewmodel_presetpos 0;srp_v03_info;alias whoamiv srp_v03_info;alias keyv v04" // 应用持枪视角预设 v03。
alias "v04" "viewmodel_fov 65;viewmodel_offset_x 2.5;viewmodel_offset_y -2;viewmodel_offset_z -2;viewmodel_presetpos 0;srp_v04_info;alias whoamiv srp_v04_info;alias keyv v05" // 应用持枪视角预设 v04。
alias "v05" "viewmodel_fov 62;viewmodel_offset_x 2.5;viewmodel_offset_y 2;viewmodel_offset_z -2;viewmodel_presetpos 0;srp_v05_info;alias whoamiv srp_v05_info;alias keyv v06" // 应用持枪视角预设 v05。
alias "v06" "viewmodel_fov 68;viewmodel_offset_x 2.5;viewmodel_offset_y 0;viewmodel_offset_z -1.5;viewmodel_presetpos 3;srp_v06_info;alias whoamiv srp_v06_info;alias keyv v07" // 应用持枪视角预设 v06。
alias "v07" "viewmodel_fov 68;viewmodel_offset_x 2.5;viewmodel_offset_y 2;viewmodel_offset_z -2;viewmodel_presetpos 0;srp_v07_info;alias whoamiv srp_v07_info;alias keyv v00" // 应用持枪视角预设 v07。

// CS:GO 无 cl_grenadecrosshair_*，因此 switchthrow 切换全屏道具对齐准星（cl_crosshairsize 1000）与当前准星预设。
alias "switchthrow" "throw" // 默认下次切换进入道具对齐准星。
alias "throw" "cl_crosshairsize 1000;cl_crosshairgap -4;cl_crosshairthickness 0.5;alias switchthrow nothrow;echo Lineup grenade crosshair ON." // 开启全屏道具对齐准星。
alias "nothrow" "srp_restore_c;alias switchthrow throw;echo Lineup grenade crosshair OFF." // 恢复当前所选 c0X 准星预设。
alias "keep" "echo [SrP-CFG] CS:GO uses switchthrow lineup crosshair toggle." // 兼容保留命令提示。

alias "red" "cl_crosshaircolor 5;cl_crosshaircolor_r 255;cl_crosshaircolor_g 0;cl_crosshaircolor_b 0;echo Crosshair color: red." // 准星颜色：红色。
alias "orange" "cl_crosshaircolor 5;cl_crosshaircolor_r 255;cl_crosshaircolor_g 165;cl_crosshaircolor_b 0;echo Crosshair color: orange." // 准星颜色：橙色。
alias "yellow" "cl_crosshaircolor 5;cl_crosshaircolor_r 255;cl_crosshaircolor_g 255;cl_crosshaircolor_b 0;echo Crosshair color: yellow." // 准星颜色：黄色。
alias "green" "cl_crosshaircolor 5;cl_crosshaircolor_r 0;cl_crosshaircolor_g 255;cl_crosshaircolor_b 0;echo Crosshair color: green." // 准星颜色：绿色。
alias "cyan" "cl_crosshaircolor 5;cl_crosshaircolor_r 0;cl_crosshaircolor_g 255;cl_crosshaircolor_b 255;echo Crosshair color: cyan." // 准星颜色：青色。
alias "blue" "cl_crosshaircolor 5;cl_crosshaircolor_r 0;cl_crosshaircolor_g 0;cl_crosshaircolor_b 255;echo Crosshair color: blue." // 准星颜色：蓝色。
alias "purple" "cl_crosshaircolor 5;cl_crosshaircolor_r 128;cl_crosshaircolor_g 0;cl_crosshaircolor_b 128;echo Crosshair color: purple." // 准星颜色：紫色。
alias "black" "cl_crosshaircolor 5;cl_crosshaircolor_r 0;cl_crosshaircolor_g 0;cl_crosshaircolor_b 0;echo Crosshair color: black." // 准星颜色：黑色。
alias "white" "cl_crosshaircolor 5;cl_crosshaircolor_r 255;cl_crosshaircolor_g 255;cl_crosshaircolor_b 255;echo Crosshair color: white." // 准星颜色：白色。
alias "pink" "cl_crosshaircolor 5;cl_crosshaircolor_r 255;cl_crosshaircolor_g 192;cl_crosshaircolor_b 203;echo Crosshair color: pink." // 准星颜色：粉色。
alias "brown" "cl_crosshaircolor 5;cl_crosshaircolor_r 165;cl_crosshaircolor_g 42;cl_crosshaircolor_b 42;echo Crosshair color: brown." // 准星颜色：棕色。
alias "gray" "cl_crosshaircolor 5;cl_crosshaircolor_r 128;cl_crosshaircolor_g 128;cl_crosshaircolor_b 128;echo Crosshair color: gray." // 准星颜色：灰色。

alias "srp_crosshair_dot" "toggle cl_crosshairdot 1 0;echo Crosshair dot toggled." // 切换准星中心点。
