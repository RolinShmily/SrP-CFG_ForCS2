// SrP-CFG 准星预设 05（CS:GO 经典参数）；修改后可在控制台执行 c05 立即预览。
cl_crosshair_drawoutline "0" // 关闭线条外缘描边。
cl_crosshair_dynamic_maxdist_splitratio "0.300000" // 动态准星内外线段分配比例。
cl_crosshair_dynamic_splitalpha_innermod "1" // 动态准星内侧线段透明度倍率。
cl_crosshair_dynamic_splitalpha_outermod "0.5" // 动态准星外侧线段透明度倍率。
cl_crosshair_dynamic_splitdist "7" // 动态准星开始分离的距离阈值。
cl_crosshair_friendly_warning "1" // 控制瞄准队友时的友军警告。
cl_crosshair_outlinethickness "0.5" // 准星描边粗细。
cl_crosshair_t "0" // 关闭 T 形准星。
cl_crosshairalpha "255" // 准星 Alpha 透明度。
cl_crosshaircolor "1" // 颜色模式 1（绿色）。
cl_crosshaircolor_b "50" // 自定义蓝色通道（颜色模式 5 时生效）。
cl_crosshaircolor_g "250" // 自定义绿色通道（颜色模式 5 时生效）。
cl_crosshaircolor_r "50" // 自定义红色通道（颜色模式 5 时生效）。
cl_crosshairdot "0" // 隐藏中心点。
cl_crosshairgap "-0.500000" // 准星中心间距。
cl_crosshairgap_useweaponvalue "0" // 禁用按武器变化的准星间距。
cl_crosshairsize "3.500000" // 准星线段长度。
cl_crosshairstyle "4" // 经典静态样式。
cl_crosshairthickness "1.000000" // 准星线段粗细。
cl_crosshairusealpha "1" // 启用自定义透明度。
cl_fixedcrosshairgap "3" // 固定准星样式的中心间距。
