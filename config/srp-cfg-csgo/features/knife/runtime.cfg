// Knife model command vocabulary (CS:GO edition). Loaded by Runtime; no preference or key is changed here.
// CS:GO 使用 give weapon_knife_* 配合 ent_fire weapon_knife addoutput "classname weapon_knifegg"（封装在 equip.cfg 避免别名嵌套引号问题）。

alias "srp_knife_switch_source" "sv_cheats 1;mp_drop_knife_enable 1;ent_fire weapon_knife kill;ent_fire weapon_knifegg kill" // 开启丢刀并清除当前匕首（含已改名为 weapon_knifegg 的刀具）；CS:GO 无 wait 指令，需与 give 跨帧执行。
alias "kk" "srp_knife_switch_source;echo [SrP-CFG] Current knife cleared. Now enter a knife code (e.g. 515)." // 控制台换刀第一步：先清刀，再在下一条命令输入编号。

alias "500" "sv_cheats 1;mp_drop_knife_enable 1;give weapon_bayonet;exec srp-cfg-csgo/features/knife/equip.cfg;echo Switched: Bayonet" // 刺刀（需先 kk 或按 G 丢刀）
alias "503" "sv_cheats 1;mp_drop_knife_enable 1;give weapon_knife_css;exec srp-cfg-csgo/features/knife/equip.cfg;echo Switched: Classic Knife" // 海豹短刀
alias "505" "sv_cheats 1;mp_drop_knife_enable 1;give weapon_knife_flip;exec srp-cfg-csgo/features/knife/equip.cfg;echo Switched: Flip Knife" // 折叠刀
alias "506" "sv_cheats 1;mp_drop_knife_enable 1;give weapon_knife_gut;exec srp-cfg-csgo/features/knife/equip.cfg;echo Switched: Gut Knife" // 穿肠刀
alias "507" "sv_cheats 1;mp_drop_knife_enable 1;give weapon_knife_karambit;exec srp-cfg-csgo/features/knife/equip.cfg;echo Switched: Karambit" // 爪子刀
alias "508" "sv_cheats 1;mp_drop_knife_enable 1;give weapon_knife_m9_bayonet;exec srp-cfg-csgo/features/knife/equip.cfg;echo Switched: M9 Bayonet" // M9 刺刀
alias "509" "sv_cheats 1;mp_drop_knife_enable 1;give weapon_knife_tactical;exec srp-cfg-csgo/features/knife/equip.cfg;echo Switched: Huntsman Knife" // 猎杀者匕首
alias "512" "sv_cheats 1;mp_drop_knife_enable 1;give weapon_knife_falchion;exec srp-cfg-csgo/features/knife/equip.cfg;echo Switched: Falchion Knife" // 弯刀
alias "514" "sv_cheats 1;mp_drop_knife_enable 1;give weapon_knife_survival_bowie;exec srp-cfg-csgo/features/knife/equip.cfg;echo Switched: Bowie Knife" // 鲍伊猎刀
alias "515" "sv_cheats 1;mp_drop_knife_enable 1;give weapon_knife_butterfly;exec srp-cfg-csgo/features/knife/equip.cfg;echo Switched: Butterfly Knife" // 蝴蝶刀
alias "516" "sv_cheats 1;mp_drop_knife_enable 1;give weapon_knife_push;exec srp-cfg-csgo/features/knife/equip.cfg;echo Switched: Shadow Daggers" // 暗影双匕
alias "517" "sv_cheats 1;mp_drop_knife_enable 1;give weapon_knife_cord;exec srp-cfg-csgo/features/knife/equip.cfg;echo Switched: Paracord Knife" // 系绳匕首
