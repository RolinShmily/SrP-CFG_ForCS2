alias "521" "sv_cheats 1;mp_drop_knife_enable 1;give weapon_knife_outdoor;exec srp-cfg-csgo/features/knife/equip.cfg;echo Switched: Nomad Knife" // 流浪者匕首
alias "522" "sv_cheats 1;mp_drop_knife_enable 1;give weapon_knife_stiletto;exec srp-cfg-csgo/features/knife/equip.cfg;echo Switched: Stiletto Knife" // 短剑
alias "523" "sv_cheats 1;mp_drop_knife_enable 1;give weapon_knife_widowmaker;exec srp-cfg-csgo/features/knife/equip.cfg;echo Switched: Talon Knife" // 锯齿爪刀
alias "524" "sv_cheats 1;mp_drop_knife_enable 1;give weapon_knife_t;exec srp-cfg-csgo/features/knife/equip.cfg;echo Switched: Default T Knife" // 默认 T 匕首
alias "525" "sv_cheats 1;mp_drop_knife_enable 1;give weapon_knife_skeleton;exec srp-cfg-csgo/features/knife/equip.cfg;echo Switched: Skeleton Knife" // 骷髅匕首
alias "526" "echo [SrP-CFG] Kukri Knife (526) is CS2-only and unavailable in CS:GO." // CS2 新增尼泊尔，CS:GO 不存在
alias "57" "sv_cheats 1;give weapon_healthshot;echo Switched: Healthshot (Syringe)" // 医疗针
alias "59" "sv_cheats 1;mp_drop_knife_enable 1;give weapon_knife;exec srp-cfg-csgo/features/knife/equip.cfg;echo Switched: Default CT Knife" // 默认 CT 匕首
alias "goldknife" "sv_cheats 1;mp_drop_knife_enable 1;give weapon_knifegg;exec srp-cfg-csgo/features/knife/equip.cfg;echo Switched: Golden Knife" // 军备竞赛金刀
alias "ghostknife" "sv_cheats 1;mp_drop_knife_enable 1;give weapon_knife_ghost;exec srp-cfg-csgo/features/knife/equip.cfg;echo Switched: Ghost Knife" // 幽灵匕首

