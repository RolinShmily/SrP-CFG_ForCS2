// Built-in Preset starting point. Safe to call from srp-cfg-csgo/user/custom.cfg.
// Put srp_apply_default near the top of custom.cfg, then write personal overrides below it.
alias "srp_apply_default" "exec srp-cfg-csgo/presets/default/apply.cfg" // 注册入口 srp_apply_default：执行推荐默认基线。

// Valve baseline reset. The raw command intentionally does not re-run user/custom.cfg.
alias "srp_reset_valve" "exec srp-cfg-csgo/valve/apply.cfg" // 恢复 CS:GO Valve 默认基线。
alias "srp_reset_valve_user" "exec srp-cfg-csgo/valve/apply.cfg;execifexists srp-cfg-csgo/user/custom.cfg" // 恢复基线后叠加个人配置。
alias "srp_reset_valve_settings" "exec srp-cfg-csgo/valve/settings.cfg" // 仅恢复参数基线。
alias "srp_reset_valve_keys" "exec srp-cfg-csgo/valve/keymap.cfg" // 仅通过 binddefaults 恢复默认键位。

// Feature entry points: settings and physical keymaps are always separate.
alias "srp_crosshair_view" "exec srp-cfg-csgo/features/crosshair-view/settings.cfg" // 应用准星与持枪视角参数。
alias "srp_crosshair_view_keys" "exec srp-cfg-csgo/features/crosshair-view/with-keymap.cfg" // 应用参数与切换快捷键。
alias "srp_knife" "exec srp-cfg-csgo/features/knife/settings.cfg" // 应用匕首模型切换环境（需本地 sv_cheats 1）。
alias "srp_knife_keys" "exec srp-cfg-csgo/features/knife/with-keymap.cfg" // 应用匕首模型切换环境与 J 键循环。

// Session mode: plain command changes mode state; _keys also installs its workspace keymap.
alias "srp_practice" "exec srp-cfg-csgo/modes/practice/settings.cfg" // 应用本地跑图参数。
alias "srp_practice_keys" "exec srp-cfg-csgo/modes/practice/with-keymap.cfg" // 应用本地跑图参数与键位。

alias "srp_reload" "exec srp-cfg-csgo/runtime/init.cfg;execifexists srp-cfg-csgo/user/custom.cfg" // 重新载入 CS:GO Runtime 与个人覆盖层。
