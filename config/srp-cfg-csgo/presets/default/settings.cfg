// SrP recommended preference example (CS:GO edition).
// This file contains settings only; physical bindings live in keymap.cfg.

// Mouse
sensitivity 0.53 // 鼠标基础灵敏度。
zoom_sensitivity_ratio_mouse 1 // 开镜灵敏度倍率（CS:GO 对应参数）。
m_yaw 0.022 // 鼠标水平转向系数。
m_rawinput 1 // 启用原始鼠标输入（绕过系统加速）。

// Crosshair
crosshair 1 // 启用游戏准星。
cl_crosshair_sniper_width 1 // 狙击镜中心线粗细。
cl_crosshair_sniper_show_normal_inaccuracy 0 // 狙击镜站立静止时隐藏额外模糊。
cl_observed_bot_crosshair 2 // 观察机器人时的准星显示模式。
cl_show_observer_crosshair 2 // 观察其他玩家时的准星显示模式。
c00 // 应用准星预设 00。
v06 // 应用持枪视角预设 06。

// Radar
cl_radar_always_centered 0 // 控制雷达是否始终以玩家为中心。
cl_radar_scale 0.37 // 雷达地图缩放比例。
cl_hud_radar_scale 1 // HUD 中雷达组件的整体尺寸。
cl_teammate_colors_show 2 // 雷达与队友标识的颜色显示模式。
cl_radar_icon_scale_min 0.6 // 雷达人物图标的最小尺寸。
cl_radar_rotate 1 // 控制雷达是否跟随玩家朝向旋转。
cl_radar_square_with_scoreboard 1 // 计分板打开时切换为方形完整雷达。
cl_hud_background_alpha 0.63 // HUD 与雷达面板背景透明度。

// HUD
hud_showtargetid 1 // 控制准星目标 ID 显示。
hud_scaling 0.85 // HUD 整体缩放比例。
safezonex 0.88 // HUD 水平安全区比例。
safezoney 0.905 // HUD 垂直安全区比例。
cl_color 0 // 玩家在队伍中的标识颜色。
cl_showloadout 0 // 控制装备栏是否常驻显示。
cl_hud_color 0 // HUD 主题颜色编号。

// Audio
volume 1 // 游戏主音量。
snd_menumusic_volume 0.03 // 主菜单音乐音量。
snd_roundstart_volume 0 // 回合开始音乐音量。
snd_roundend_volume 0.02 // 回合结束音乐音量。
snd_mvp_volume 0.12 // MVP 音乐音量。
snd_mapobjective_volume 0.12 // 炸弹或人质目标音乐音量。
snd_tensecondwarning_volume 0.08 // 十秒警告音乐音量。
snd_deathcamera_volume 0.08 // 死亡视角音乐音量。
snd_mute_mvp_music_live_players 1 // 双方仍有玩家存活时静音 MVP 音乐。
snd_mute_losefocus 0 // 游戏失去焦点时不静音。
voice_enable 1 // 启用玩家语音通信（CS:GO 对应参数）。

// General preferences
net_graph 1 // 启用实时网络与帧率参数监视。
net_graphproportionalfont 0 // 使用小号等宽 net_graph 字体。
mm_dedicated_search_maxping 70 // 匹配服务器允许的最大延迟。
cl_righthand 1 // 默认右手持枪。
cl_use_opens_buy_menu 0 // 禁止使用键打开购买菜单。
cl_dm_buyrandomweapons 0 // 关闭死斗模式随机购枪。
cl_hud_playercount_showcount 0 // 顶部队伍栏显示玩家头像。
r_drawtracers_firstperson 1 // 显示第一人称曳光弹。
mat_monitorgamma 2.3 // 游戏亮度 Gamma 值。
cl_teamid_overhead_always 2 // 常驻穿透显示队友头顶位置与装备。
con_enable 1 // 启用开发者控制台。
fps_max 0 // 前台最大帧率；0 表示不限制。
gameinstructor_enable 0 // 关闭游戏教学提示。
cl_autohelp 0 // 关闭自动帮助提示。
func_break_max_pieces 0 // 减少可破坏物碎片数量。
spec_replay_autostart 0 // 关闭阵亡回放自动播放。
cl_autowepswitch 0 // 禁止拾取武器时自动切枪。

// Chat wheel (CS:GO Broken Fang+)
cl_radial_radio_tap_to_ping 0 // 关闭快捷轮盘轻点直接标记。
cl_radial_radio_tab 0 // 默认激活的快捷轮盘页。
