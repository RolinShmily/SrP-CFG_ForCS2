alias "CT3" "setpos_exact -1488.28 874.82 1614.00;setang 0 0 0;echo Teleported to: Cache - CT 3"
alias "CT4" "setpos_exact -1400.28 874.82 1614.03;setang 0 0 0;echo Teleported to: Cache - CT 4"

alias "T1" "setpos_exact 3094.27 -152.58 1608.00;setang 0 180 0;echo Teleported to: Cache - T 1"
alias "T2" "setpos_exact 2995.89 -168.00 1608.00;setang 0 180 0;echo Teleported to: Cache - T 2"
alias "T3" "setpos_exact 3171.64 -100.83 1608.03;setang 0 180 0;echo Teleported to: Cache - T 3"
alias "T4" "setpos_exact 3041.77 -21.08 1608.00;setang 0 180 0;echo Teleported to: Cache - T 4"
alias "T5" "setpos_exact 2916.77 69.42 1608.00;setang 0 180 0;echo Teleported to: Cache - T 5"
alias "T6" "setpos_exact 3077.77 135.92 1616.00;setang 0 180 0;echo Teleported to: Cache - T 6"
alias "T7" "setpos_exact 3019.27 225.42 1616.00;setang 0 180 0;echo Teleported to: Cache - T 7"

echo "Map: Cache (CS:GO) | CT: 4 verified spawns | T: 7 verified spawns"
