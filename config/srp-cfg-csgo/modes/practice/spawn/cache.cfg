// Cache出生点配置（CS:GO 经典图坐标）
// 初始化所有出生点
exec srp-cfg-csgo/modes/practice/spawn/init_spawns.cfg // 重置出生点别名，避免切图后残留旧坐标。

// 设置可用的出生点（setpos_exact 已由 CS:GO getpos Z 减去 64 眼高得到地面原点）
alias "CT1" "setpos_exact -1488.28 706.82 1614.00;setang 0 0 0;echo Teleported to: Cache - CT 1"
