// Ancient出生点配置（CS:GO 坐标）
// 初始化所有出生点
exec srp-cfg-csgo/modes/practice/spawn/init_spawns.cfg // 重置出生点别名，避免切图后残留旧坐标。

// 设置可用的出生点（setpos_exact 已由 CS:GO getpos Z 减去 64 眼高得到地面原点）
alias "CT1" "setpos_exact -192.00 1696.00 24.77;setang 0 270 0;echo Teleported to: Ancient - CT 1"
alias "CT2" "setpos_exact -256.00 1728.00 24.95;setang 0 270 0;echo Teleported to: Ancient - CT 2"
alias "CT3" "setpos_exact -352.00 1728.00 27.64;setang 0 270 0;echo Teleported to: Ancient - CT 3"
alias "CT4" "setpos_exact -448.00 1728.00 29.34;setang 0 270 0;echo Teleported to: Ancient - CT 4"
alias "CT5" "setpos_exact -512.00 1696.00 24.76;setang 0 270 0;echo Teleported to: Ancient - CT 5"

alias "T1" "setpos_exact -328.00 -2288.00 -163.26;setang 0 90 0;echo Teleported to: Ancient - T 1"
alias "T2" "setpos_exact -456.00 -2288.00 -163.26;setang 0 90 0;echo Teleported to: Ancient - T 2"
alias "T3" "setpos_exact -584.00 -2288.00 -162.80;setang 0 90 0;echo Teleported to: Ancient - T 3"
alias "T4" "setpos_exact -392.00 -2224.00 -163.26;setang 0 90 0;echo Teleported to: Ancient - T 4"
alias "T5" "setpos_exact -520.00 -2224.00 -163.26;setang 0 90 0;echo Teleported to: Ancient - T 5"

echo "Map: Ancient (CS:GO) | CT: 5 spawns | T: 5 spawns"
