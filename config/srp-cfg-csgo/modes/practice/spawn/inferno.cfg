// Inferno出生点配置（CS:GO 坐标）
// 初始化所有出生点
exec srp-cfg-csgo/modes/practice/spawn/init_spawns.cfg // 重置出生点别名，避免切图后残留旧坐标。

// 设置可用的出生点（setpos_exact 已由 CS:GO getpos Z 减去 64 眼高得到地面原点）
alias "CT1" "setpos_exact 2292.06 2027.69 135.47;setang 0 70 0;echo Teleported to: Inferno - CT 1"
alias "CT2" "setpos_exact 2353.00 1977.00 135.13;setang 0 97.5 0;echo Teleported to: Inferno - CT 2"
alias "CT3" "setpos_exact 2397.00 2079.00 132.64;setang 0 135 0;echo Teleported to: Inferno - CT 3"
alias "CT4" "setpos_exact 2472.35 2005.97 133.82;setang 0 160 0;echo Teleported to: Inferno - CT 4"
alias "CT5" "setpos_exact 2493.00 2090.00 132.27;setang 0 223.5 0;echo Teleported to: Inferno - CT 5"
alias "CT6" "setpos_exact 2456.83 2153.16 132.06;setang 0 251.5 0;echo Teleported to: Inferno - CT 6"

alias "T1" "setpos_exact -1650.00 718.00 -63.97;setang 0 0 0;echo Teleported to: Inferno - T 1"
alias "T2" "setpos_exact -1596.00 579.00 -63.97;setang 0 0 0;echo Teleported to: Inferno - T 2"
alias "T3" "setpos_exact -1491.00 490.00 -63.97;setang 0 0 0;echo Teleported to: Inferno - T 3"
alias "T4" "setpos_exact -1579.00 673.00 -63.97;setang 0 0 0;echo Teleported to: Inferno - T 4"
alias "T5" "setpos_exact -1657.23 419.58 -63.97;setang 0 0 0;echo Teleported to: Inferno - T 5"

echo "Map: Inferno (CS:GO) | CT: 6 spawns | T: 5 spawns"
