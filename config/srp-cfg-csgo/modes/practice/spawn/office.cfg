// Office出生点配置（延续上游 srp-cfg 占位坐标）
// 初始化所有出生点
exec srp-cfg-csgo/modes/practice/spawn/init_spawns.cfg // 重置出生点别名，避免切图后残留旧坐标。

// 设置可用的出生点（注：此处与原版 srp-cfg 一致，使用近似占位坐标）
alias "CT1" "setpos_exact 1800 2100 -100;setang 0 270 0;echo Teleported to: Office - CT 1"
alias "CT2" "setpos_exact 1800 2000 -100;setang 0 270 0;echo Teleported to: Office - CT 2"
alias "CT3" "setpos_exact 1800 1900 -100;setang 0 270 0;echo Teleported to: Office - CT 3"
alias "CT4" "setpos_exact 1700 2050 -100;setang 0 270 0;echo Teleported to: Office - CT 4"
alias "CT5" "setpos_exact 1700 1950 -100;setang 0 270 0;echo Teleported to: Office - CT 5"

alias "T1" "setpos_exact -1800 1000 -100;setang 0 90 0;echo Teleported to: Office - T 1"
alias "T2" "setpos_exact -1800 900 -100;setang 0 90 0;echo Teleported to: Office - T 2"
alias "T3" "setpos_exact -1800 800 -100;setang 0 90 0;echo Teleported to: Office - T 3"
alias "T4" "setpos_exact -1700 950 -100;setang 0 90 0;echo Teleported to: Office - T 4"
alias "T5" "setpos_exact -1700 850 -100;setang 0 90 0;echo Teleported to: Office - T 5"

echo "Map: Office (CS:GO placeholder) | CT: 5 spawns | T: 5 spawns"
