// Vertigo出生点配置（CS:GO 坐标）
// 初始化所有出生点
exec srp-cfg-csgo/modes/practice/spawn/init_spawns.cfg // 重置出生点别名，避免切图后残留旧坐标。

// 设置可用的出生点（setpos_exact 已由 CS:GO getpos Z 减去 64 眼高得到地面原点）
alias "CT1" "setpos_exact -860.14 940.28 11776.03;setang 0 301 0;echo Teleported to: Vertigo - CT 1"
alias "CT2" "setpos_exact -929.63 918.64 11776.03;setang 0 329 0;echo Teleported to: Vertigo - CT 2"
alias "CT3" "setpos_exact -1189.34 862.17 11776.03;setang 0 9.5 0;echo Teleported to: Vertigo - CT 3"
alias "CT4" "setpos_exact -1126.58 925.89 11776.03;setang 0 307 0;echo Teleported to: Vertigo - CT 4"
alias "CT5" "setpos_exact -1044.03 924.31 11776.03;setang 0 279.5 0;echo Teleported to: Vertigo - CT 5"

alias "T1" "setpos_exact -1411.31 -1130.31 11488.03;setang 0 317.5 0;echo Teleported to: Vertigo - T 1"
alias "T2" "setpos_exact -1502.57 -1360.83 11488.03;setang 0 172 0;echo Teleported to: Vertigo - T 2"
alias "T3" "setpos_exact -1439.76 -1322.04 11488.03;setang 0 193.5 0;echo Teleported to: Vertigo - T 3"
alias "T4" "setpos_exact -1359.29 -1324.46 11488.03;setang 0 243 0;echo Teleported to: Vertigo - T 4"
alias "T5" "setpos_exact -1467.47 -1428.66 11488.03;setang 0 272.5 0;echo Teleported to: Vertigo - T 5"

echo "Map: Vertigo (CS:GO) | CT: 5 spawns | T: 5 spawns"
