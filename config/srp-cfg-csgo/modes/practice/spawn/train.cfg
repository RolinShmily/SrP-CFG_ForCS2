// Train出生点配置（CS:GO 原版 de_train；CS2 重制版 Train 坐标不通用）
// 初始化所有出生点
exec srp-cfg-csgo/modes/practice/spawn/init_spawns.cfg // 重置出生点别名，避免切图后残留旧坐标。

// 设置可用的出生点（setpos_exact 已由 CS:GO getpos Z 减去 64 眼高得到地面原点）
alias "CT1" "setpos_exact 1371.00 -1231.00 -334.00;setang 0 112.5 0;echo Teleported to: Train - CT 1"
alias "CT2" "setpos_exact 1552.00 -1488.00 -320.00;setang 0 112.5 0;echo Teleported to: Train - CT 2"

alias "T1" "setpos_exact -2033.00 1316.00 -192.00;setang 0 -5 0;echo Teleported to: Train - T 1"
alias "T2" "setpos_exact -1699.00 1360.00 -190.00;setang 0 7 0;echo Teleported to: Train - T 2"

echo "Map: Train (CS:GO) | CT: 2 verified spawns | T: 2 verified spawns"
