alias "keyhud" "pvp-hud-off"
alias "pvp-hud-off" "cl_draw_only_deathnotices 1;cl_drawhud_force_radar 1;alias keyhud pvp-hud-on;echo Switched to PVP HUD: death notices, crosshair and radar only!"
alias "pvp-hud-on" "cl_draw_only_deathnotices 0;cl_drawhud_force_radar 0;alias keyhud pvp-hud-off;echo Switched to PVP HUD: show everything!"

alias "tick" "cl_ticktiming print summary;cl_ticktiming print detail;"
