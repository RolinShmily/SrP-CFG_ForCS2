// SrP-CFG 准星预设 06；修改后可在控制台执行 c06 立即预览。
cl_crosshair_drawoutline "false" // 将准星描边设为false：关闭线条外缘描边。
cl_crosshair_dynamic_maxdist_splitratio "0.300000" // 将动态准星内外线段分配比例设为 0.300000（0–1）；值越大，外侧线段占比越高。
cl_crosshair_dynamic_splitalpha_innermod "1.000000" // 将动态准星分离后内侧线段透明度倍率设为 1.000000（0–1）。
cl_crosshair_dynamic_splitalpha_outermod "0.500000" // 将动态准星分离后外侧线段透明度倍率设为 0.500000（通常 0.3–1）。
cl_crosshair_dynamic_splitdist "7" // 将动态准星开始分离的距离阈值设为 7；仅动态样式使用。
cl_crosshair_dynamic_spread_limit "255" // 动态准星显示扩散的上限（0–255）。
cl_crosshair_gap "1" // 新准星体系的中心间距（0–128，像素偏移）；旧 cl_crosshairgap 已被移除。
cl_crosshair_length "3" // 新准星体系的线段长度；取代旧 cl_crosshairsize。
cl_crosshair_recoil "false" // 将准星后坐力跟随设为false：关闭准星随枪械后坐力移动。
cl_crosshair_screen_height "1080" // 书写这些尺寸设置时的屏幕高度；游戏会在尺寸变化时自动更新。
cl_crosshair_t "false" // 将 T 形准星设为false：保留上方线段。
cl_crosshair_thickness "1" // 新准星体系的线段粗细（0–31）；取代旧 cl_crosshairthickness。
cl_crosshaircolor_a "255" // 准星 Alpha（0–255）；取代已移除的 cl_crosshairalpha 与 cl_crosshairusealpha。
cl_crosshaircolor_b "56" // 将自定义准星蓝色通道设为 56（0–255）；新体系始终使用自定义 RGB。
cl_crosshaircolor_g "230" // 将自定义准星绿色通道设为 230（0–255）；新体系始终使用自定义 RGB。
cl_crosshaircolor_r "206" // 将自定义准星红色通道设为 206（0–255）；新体系始终使用自定义 RGB。
cl_crosshairdot "true" // 将准星中心点设为true：显示中心点。
cl_crosshairstyle "4" // 将准星样式设为 4（经典静态）。
