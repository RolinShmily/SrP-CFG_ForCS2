alias "+Pucci" "host_timescale 25"
alias "-Pucci" "host_timescale 1"
alias "switch-impactsNpreview" "impactsNpreview-on"
alias "impactsNpreview-on" "sv_showimpacts 1;sv_grenade_trajectory_prac_pipreview 1;alias switch-impactsNpreview impactsNpreview-off;echo Impacts and grenade preview ON!"
alias "impactsNpreview-off" "sv_showimpacts 0;sv_grenade_trajectory_prac_pipreview 0;alias switch-impactsNpreview impactsNpreview-on;echo Impacts and grenade preview OFF!"
alias "switchperson" "switchperson-third"
alias "switchperson-third" "thirdperson;alias switchperson switchperson-first;echo Third person ON!"
alias "switchperson-first" "firstperson;alias switchperson switchperson-third;echo First person ON!"
alias "spawn" "exec srp-cfg/modes/practice/spawn/spawn.cfg"
alias "gkd" "mp_respawn_on_death_ct 0;mp_respawn_on_death_t 0;sv_showimpacts 0;sv_infinite_ammo 0;sv_alltalk 0;mp_buy_anywhere 0;mp_freezetime 4;mp_restartgame 1;sv_cheats 0;echo Standard match mode!"
alias "gg" "sv_cheats 1;mp_respawn_on_death_ct 1;mp_respawn_on_death_t 1;sv_showimpacts 1;sv_infinite_ammo 1;sv_alltalk 1;mp_buy_anywhere 1;mp_freezetime 1;echo Practice mode restored!"
alias "plant" "mp_plant_c4_anywhere 1;echo Plant anywhere ON!"
alias "xray" "toggle spec_show_xray 0 1;echo X-ray toggled!"

alias "srp_prac_armor" "give item_assaultsuit;echo Armor added!"
alias "srp_prac_regen" "toggle sv_regeneration_force_on 0 1;echo Auto regen toggled!"
alias "srp_prac_bot_add" "bot_add;mp_death_drop_gun 0;echo Bot added!"
alias "srp_prac_bot_crouch" "toggle bot_crouch;echo Bot crouch toggled!"
alias "srp_prac_bot_mimic" "toggle bot_mimic 0 -1;echo Bot mimic toggled!"
alias "srp_prac_fov" "toggle fov_cs_debug 0 30;echo FOV toggled!"
alias "srp_prac_bot_kick" "bot_kick;mp_death_drop_gun 1;echo All bots kicked!"
alias "srp_prac_teammates_enemies" "toggle mp_teammates_are_enemies 0 1;echo Teammates as enemies toggled!"
alias "srp_prac_bhop" "toggle sv_enablebunnyhopping;toggle sv_autobunnyhopping;toggle cl_showpos;toggle sv_airaccelerate 1000 12;echo Bhop toggled"
alias "srp_prac_showpos" "toggle cl_showpos 0 1"
alias "srp_prac_rethrow" "sv_rethrow_last_grenade;echo Last grenade rethrown!"
alias "srp_prac_noclip" "noclip"
alias "srp_prac_clear_grenades" "ent_fire smokegrenade_projectile kill;ent_fire flashbang_projectile kill;ent_fire incgrenade_projectile kill;ent_fire molotov_projectile kill;ent_fire hegrenade_projectile kill;ent_fire decoy_projectile kill;stopsound;echo Grenades cleared!"
alias "srp_prac_aoproxy" "toggle r_aoproxy_show 1 0;echo AO proxy toggled!"
alias "srp_prac_infammo" "toggle sv_infinite_ammo 1 2;echo Infinite ammo toggled!"
alias "srp_prac_teamid" "toggle cl_teamid_overhead_mode 1 3"
alias "srp_prac_bot_kill" "bot_kill;echo All bots killed!"
alias "srp_prac_restart" "mp_restartgame 1;mp_death_drop_gun 1;echo Game restarting in 1 second!"
alias "srp_prac_bot_place" "bot_stop 1;bot_place;echo Bot placed!"
