// Anubis出生点配置
// 初始化所有出生点
exec srp-cfg/modes/practice/spawn/init_spawns.cfg // 加载 srp-cfg/modes/practice/spawn/init_spawns.cfg，继续执行该模块配置链。

// 设置可用的出生点
alias "CT1" "setpos_exact -400 2192 32.0001;setang 0 240 0;echo Teleported to: Anubis - CT 1" // 注册 CT1 出生点：设置精确坐标与视角，并输出传送目标。
