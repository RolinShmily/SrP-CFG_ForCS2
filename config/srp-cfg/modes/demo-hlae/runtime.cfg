alias "rec" "demo_timescale 1;fps_max 0;echo >>> HLAE recording started;mirv_streams record start"
alias "rec_end" "mirv_streams record end;echo >>> HLAE recording ended"
alias "checkSetting" "echo;echo [Current recording FPS];mirv_streams record fps;echo"
alias "campath" "campath_on"
alias "campath_on" "mirv_campath enabled 1;alias campath campath_off;echo >>> Camera on"
alias "campath_off" "mirv_campath enabled 0;alias campath campath_on;echo >>> Camera off"
alias "campath_draw" "campath_draw_on"
alias "campath_draw_on" "mirv_campath draw enabled 1;alias campath_draw campath_draw_off;echo >>> Camera path display on"
alias "campath_draw_off" "mirv_campath draw enabled 0;alias campath_draw campath_draw_on;echo >>> Camera path display off"
alias "dmsg" "dmsg_on"
alias "dmsg_on" "alias dmsg dmsg_off;mirv_deathmsg filter add attackerMatch=!Trace block=1;mirv_deathmsg lifetime 90;echo >>> Kill feed filter (current player) on"
alias "dmsg_off" "alias dmsg dmsg_on;mirv_deathmsg filter clear;mirv_deathmsg lifetime default;mirv_deathmsg clear;echo >>> Kill feed filter off"
alias "block" "blockOn"
alias "blockOn" "alias block blockOff;mirv_deathmsg lifetime 0;echo [Kill feed blocked]"
alias "blockOff" "alias block blockOn;mirv_deathmsg lifetime default;echo [Kill feed lifetime restored]"
alias "widefov" "widefovOn"
alias "widefovOn" "alias widefov widefovOff;mirv_fov 105;echo [Wide FOV on]"
alias "widefovOff" "alias widefov widefovOn;mirv_fov default;echo [Default FOV restored]"
alias "gear_up" "gear4"
alias "gear_down" "gear14"
alias "gear110" "demo_timescale 0.1;alias gear_up gear15;alias gear_down gear110;echo [Demo playback speed];echo X0.1"
alias "gear15" "demo_timescale 0.2;alias gear_up gear14;alias gear_down gear110;echo [Demo playback speed];echo X0.2"
alias "gear14" "demo_timescale 0.25;alias gear_up gear1;alias gear_down gear15;echo [Demo playback speed];echo X0.25"
alias "gear1" "demo_timescale 1;alias gear_up gear4;alias gear_down gear14;echo [Demo playback speed];echo X1"
alias "gear4" "demo_timescale 4;alias gear_up gear8;alias gear_down gear1;echo [Demo playback speed];echo X4"
alias "gear8" "demo_timescale 8;alias gear_up gear8;alias gear_down gear4;echo [Demo playback speed];echo X8"
alias "gear16" "demo_timescale 16;alias gear_up gear16;alias gear_down gear8;echo [Demo playback speed];echo X16"
alias "ass" "toggle mp_display_kill_assists;echo [Assist display toggled]"
alias "mute" "snd_menumusic_volume 0;snd_roundstart_volume 0;snd_roundend_volume 0;snd_roundaction_volume 0;snd_mapobjective_volume 0;snd_tensecondwarning_volume 0;snd_deathcamera_volume 0;snd_mvp_volume 0;snd_mute_mvp_music_live_players 1;snd_mute_losefocus 0;echo [Audio muted]"
alias "t" "unbind uparrow;unbind downarrow;unbind leftarrow;unbind rightarrow;unbind pgup;unbind pgdn;unbind -;unbind =;echo >>> Camera conflict keys unbound"
alias "f100" "mirv_input fov 100"
alias "f95" "mirv_input fov 95"
alias "f90" "mirv_input fov 90"
alias "f85" "mirv_input fov 85"
alias "f80" "mirv_input fov 80"
alias "f75" "mirv_input fov 75"
alias "f70" "mirv_input fov 70"
alias "f65" "mirv_input fov 65"
alias "f60" "mirv_input fov 60"
alias "f55" "mirv_input fov 55"
alias "f50" "mirv_input fov 50"
alias "f45" "mirv_input fov 45"
alias "f40" "mirv_input fov 40"
alias "f35" "mirv_input fov 35"
alias "f30" "mirv_input fov 30"
alias "f25" "mirv_input fov 25"
alias "f20" "mirv_input fov 20"
alias "f15" "mirv_input fov 15"
alias "f10" "mirv_input fov 10"
alias "pos" "mirv_campath edit position current"
alias "time" "mirv_campath edit start"
alias "post" "toggle r_csgo_postprocess_enable;echo [Postprocess toggled]"
alias "demonoshow" "cl_spec_show_bindings 0;echo Spec hint text hidden!"
alias "demoshow" "cl_spec_show_bindings 1;echo Spec hint text shown!"
alias "grenadeoff" "sv_grenade_trajectory_prac_pipreview false;echo Grenade trajectory preview off!"
alias "grenadeon" "sv_grenade_trajectory_prac_pipreview true;echo Grenade trajectory preview on!"
alias "bluron" "mirv_streams record fps 600;mirv_streams record screen settings blur;echo Motion blur on!"
alias "bluroff" "mirv_streams record fps 60;mirv_streams record screen settings mp4;echo Motion blur off!"


alias "srp_demo_record_start" "rec;demo_resume;checkSetting"
alias "srp_demo_record_end" "rec_end;demo_pause"
alias "srp_demo_hud_deathnotices" "toggle cl_draw_only_deathnotices"
alias "srp_demo_voice" "toggle voice_enable;toggle voice_caster_enable"
alias "srp_demo_player_voice" "toggle tv_listen_voice_indices -1 0"
alias "srp_demo_xray" "toggle spec_show_xray 0 1"
alias "srp_demo_crosshair" "toggle crosshair"
alias "srp_demo_hud_full" "toggle cl_drawhud"
alias "srp_demo_radar" "incrementvar cl_drawhud_force_radar -1 1 1"
alias "srp_demo_teamid" "toggle cl_teamid_overhead_mode 1 3"
alias "srp_demo_camera_mode" "mirv_input camera;echo Camera mode on. Press Esc to exit and apply the path"
alias "srp_demo_seek_back" "demo_goto -5s relative"
alias "srp_demo_seek_forward" "demo_goto 5s relative"
alias "srp_demo_campath_start_forward" "mirv_campath edit start delta+0.25"
alias "srp_demo_campath_start_back" "mirv_campath edit start delta-0.25"
alias "srp_demo_tick_rec" "mirv_cmd addTick rec"
alias "srp_demo_tick_rec_end" "mirv_cmd addTick rec_end"
alias "srp_demo_cmd_print" "mirv_cmd print"
alias "srp_demo_cmd_clear" "mirv_cmd clear;echo >>> Cleared!"
alias "srp_demo_campath_add" "mirv_campath add;echo Camera node added"
alias "srp_demo_campath_print" "mirv_campath print"
alias "srp_demo_campath_clear" "mirv_campath clear;echo All camera nodes cleared"
alias "srp_demo_campath_remove_1" "mirv_campath remove 1"
alias "srp_demo_campath_remove_2" "mirv_campath remove 2"
alias "srp_demo_campath_remove_3" "mirv_campath remove 3"
alias "srp_demo_campath_remove_4" "mirv_campath remove 4"
alias "srp_demo_campath_remove_5" "mirv_campath remove 5"
alias "srp_demo_campath_remove_6" "mirv_campath remove 6"
alias "srp_demo_campath_remove_7" "mirv_campath remove 7"
alias "srp_demo_campath_remove_8" "mirv_campath remove 8"
alias "srp_demo_campath_remove_9" "mirv_campath remove 9"
alias "srp_demo_campath_remove_0" "mirv_campath remove 0"
alias "srp_demo_ui" "demoui"
alias "srp_demo_togglepause" "demo_togglepause"
alias "srp_demo_marktick" "demo_marktick"
alias "srp_demo_gotomark" "demo_gotomark"
alias "srp_demo_campath" "campath"
alias "srp_demo_campath_draw" "campath_draw"
alias "srp_demo_dmsg" "dmsg"
alias "srp_demo_block" "block"
alias "srp_demo_widefov" "widefov"
alias "srp_demo_gear_up" "gear_up"
alias "srp_demo_gear_down" "gear_down"
alias "srp_demo_mute" "mute"
