# Static site + /releases/* streaming proxy Worker (GitHub Releases source of truth).
name = "srp-cfg"
compatibility_date = "2026-10-06"
main = "./worker/index.ts"
workers_dev = false
preview_urls = false

[assets]
directory = "./website/build/client"
binding = "ASSETS"
html_handling = "auto-trailing-slash"
not_found_handling = "404-page"
run_worker_first = ["/releases/*"]
